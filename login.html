<!doctype html>
<html lang="en" data-theme-key="docket-theme" data-lang-key="docket-lang" data-header="X-Docket" data-reset="node server.js --reset-password">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docket-gits</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%231f2328' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M30 9q1-6 7-5M33 9q3-3 6-1'/%3E%3Ccircle cx='32' cy='34' r='24' fill='%23f2c94c'/%3E%3Ccircle cx='23' cy='29' r='3.2' fill='%231f2328' stroke='none'/%3E%3Ccircle cx='41' cy='29' r='3.2' fill='%231f2328' stroke='none'/%3E%3Ccircle cx='24' cy='28' r='1' fill='%23fff' stroke='none'/%3E%3Ccircle cx='42' cy='28' r='1' fill='%23fff' stroke='none'/%3E%3Cellipse cx='32' cy='39' rx='9' ry='5' fill='%23f2994a'/%3E%3Cpath d='M24 39h16'/%3E%3Ccircle cx='15' cy='37' r='3' fill='%23f4a6a6' stroke='none'/%3E%3Ccircle cx='49' cy='37' r='3' fill='%23f4a6a6' stroke='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="login.css">
<script src="login.js"></script>
</head>
<body>
<main class="auth">
  <form class="auth-card" id="authForm" hidden novalidate>
    <div class="auth-brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M30 9q1-6 7-5M33 9q3-3 6-1"/><circle cx="32" cy="34" r="24" fill="#f2c94c"/><circle cx="23" cy="29" r="3.2" fill="#1f2328" stroke="none"/><circle cx="41" cy="29" r="3.2" fill="#1f2328" stroke="none"/><circle cx="24" cy="28" r="1" fill="#fff" stroke="none"/><circle cx="42" cy="28" r="1" fill="#fff" stroke="none"/><ellipse cx="32" cy="39" rx="9" ry="5" fill="#f2994a"/><path d="M24 39h16"/><circle cx="15" cy="37" r="3" fill="#f4a6a6" stroke="none"/><circle cx="49" cy="37" r="3" fill="#f4a6a6" stroke="none"/></svg>
      <span>docket-gits</span>
    </div>
    <h1 id="authTitle"></h1>
    <p class="auth-help" id="authHelp"></p>
    <label class="auth-field" id="authCodeRow" hidden><span id="authCodeLabel"></span><input id="authCode" autocomplete="off" spellcheck="false" maxlength="64"></label>
    <label class="auth-field"><span id="authNameLabel"></span><input id="authName" name="username" autocomplete="username" maxlength="64" required></label>
    <label class="auth-field"><span id="authPassLabel"></span><input id="authPass" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required></label>
    <label class="auth-field" id="authConfirmRow"><span id="authConfirmLabel"></span><input id="authConfirm" type="password" autocomplete="new-password" maxlength="1024"></label>
    <p class="auth-err" id="authErr" role="alert"></p>
    <button class="auth-btn" id="authSubmit" type="submit"></button>
    <p class="auth-note" id="authNote"><span id="authForgot"></span><br><code id="authCmd"></code></p>
  </form>
</main>
</body>
</html>
