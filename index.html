<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Board</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #fff; --lane: #eef1f4; --border: #d0d7de; --text: #1f2328; --muted: #656d76;
    --accent: #0969da; --accent-text: #fff; --ok: #1a7f37; --warn: #9a6700; --danger: #cf222e; --chip: #eaeef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --lane: #10151c; --border: #30363d; --text: #e6edf3; --muted: #8d96a0;
      --accent: #2f81f7; --accent-text: #fff; --ok: #3fb950; --warn: #d29922; --danger: #f85149; --chip: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header .meta { color: var(--muted); font-size: 12px; }
  .avatar { width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; }
  .banner { margin: 12px 16px 0; padding: 8px 12px; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; white-space: pre-wrap; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 12px; padding: 16px; overflow-x: auto; }
  .lane { background: var(--lane); border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 60vh; }
  .lane h2 { font-size: 14px; margin: 4px 4px 8px; display: flex; gap: 8px; align-items: center; }
  .lane h2 .count { background: var(--chip); border-radius: 10px; padding: 0 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px; }
  .card.clickable { cursor: pointer; }
  .card[draggable] { cursor: grab; }
  .lane.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .card.clickable:hover { border-color: var(--accent); }
  .card .top { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .card .top .grow { flex: 1; }
  .card .title { margin: 4px 0 6px; font-weight: 600; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .chip { font-size: 11px; border-radius: 10px; padding: 0 8px; border: 1px solid var(--border); background: var(--chip); }
  .chip.draft { color: var(--muted); }
  .chip.merged { border-color: #8250df; color: #8250df; }
  .chip.err { border-color: var(--danger); color: var(--danger); }
  .chip.off { border-color: var(--warn); color: var(--warn); }
  .issue { font-size: 12px; display: block; color: var(--muted); }
  .reviewers { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .rv { position: relative; }
  .rv .st { position: absolute; right: -4px; bottom: -4px; font-size: 10px; background: var(--panel); border-radius: 50%; line-height: 1; }
  .rv.pending img { opacity: .4; }
  .actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10; max-width: calc(100vw - 32px); background: var(--danger); color: #fff; padding: 8px 16px; border-radius: 6px; white-space: pre-wrap; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  dialog { width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head, .dlg-foot { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
  .dlg-foot { border-bottom: 0; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--panel); }
  .dlg-head h3 { margin: 0; font-size: 16px; flex: 1; }
  .dlg-body { padding: 12px 16px; }
  .finding { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .finding.agree { border-left: 4px solid var(--ok); }
  .finding.disagree { border-left: 4px solid var(--danger); }
  .finding .head { display: flex; gap: 8px; align-items: baseline; }
  .finding .head .grow { flex: 1; font-weight: 600; }
  .finding pre, .raw { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border-radius: 6px; padding: 8px; margin: 6px 0; }
  .verdict { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .verdict button.on.agree { background: var(--ok); border-color: var(--ok); color: #fff; }
  .verdict button.on.disagree { background: var(--danger); border-color: var(--danger); color: #fff; }
  .verdict textarea { flex: 1; min-height: 34px; resize: vertical; }
  table.repos { width: 100%; border-collapse: collapse; }
  table.repos th, table.repos td { border-bottom: 1px solid var(--border); padding: 6px; text-align: left; }
  table.repos input, table.repos select { width: 100%; }
  .form-row { display: grid; grid-template-columns: 180px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .form-row input, .form-row textarea { width: 100%; }
  @media (max-width: 700px) {
    .board { grid-template-columns: repeat(4, 85vw); }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Review Board</h1>
  <span class="meta" id="meta"></span>
  <span id="viewer"></span>
  <button id="refresh">更新</button>
  <button id="open-settings">設定</button>
</header>
<div id="banner"></div>
<main class="board" id="board"></main>

<dialog id="review-dlg"></dialog>
<dialog id="settings-dlg"></dialog>

<script>
const LANES = [
  { id: 'requested', label: 'Requested', color: '#1a7f37', statuses: ['requested'] },
  { id: 'reviewing', label: 'Reviewing', color: '#9a6700', statuses: ['queued', 'reviewing'] },
  { id: 'reviewed', label: 'Reviewed', color: '#0969da', statuses: ['reviewed', 'posting'] },
  { id: 'commented', label: 'Done', color: '#8250df', statuses: ['commented'] },
];
const REVIEW_ICON = { APPROVED: '✅', CHANGES_REQUESTED: '🔴', COMMENTED: '💬', DISMISSED: '⚪', PENDING: '⏳' };
const POLL_LOCAL_MS = 5000;

let board = { prs: [], config: { repos: {} } };
let openKey = null;

// 内蔵ブラウザ (Electron など) では confirm()/alert() が表示されず即 false になるため、
// 確認は「もう一度押す」方式、通知はトーストで行う
const CONFIRM_MS = 5000;
let armed = null;
function confirmTwice(btn, id, label) {
  if (armed?.id === id && Date.now() < armed.until) {
    armed = null;
    return true;
  }
  armed = { id, until: Date.now() + CONFIRM_MS };
  const original = btn.textContent;
  btn.textContent = label;
  setTimeout(() => {
    if (btn.isConnected) btn.textContent = original;
    render();
  }, CONFIRM_MS);
  return false;
}
const armedLabel = (id, normal, confirmLabel) => (armed?.id === id && Date.now() < armed.until ? confirmLabel : normal);
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.append(el);
  setTimeout(() => el.remove(), 6000);
}

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Review-Board': '1' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error || res.statusText);
  return json;
}

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 60) return `${min}分前`;
  if (min < 60 * 24) return `${Math.round(min / 60)}時間前`;
  return `${Math.round(min / 1440)}日前`;
}

async function load(refresh = false) {
  try {
    board = await api(`/api/board${refresh ? '?refresh=1' : ''}`);
  } catch (e) {
    board.fetchError = e.message;
  }
  render();
}

function render() {
  if (dragging) return; // 再描画するとドラッグが途切れる
  $('#viewer').innerHTML = board.viewer ? `<img class="avatar" src="${esc(board.viewer.avatarUrl)}" alt=""> ${esc(board.viewer.login)}` : '';
  $('#meta').textContent = board.lastFetchedAt ? `最終取得 ${new Date(board.lastFetchedAt).toLocaleTimeString()}` : '';
  $('#banner').innerHTML = board.fetchError ? `<div class="banner">GitHub の取得に失敗しました: ${esc(board.fetchError)}</div>` : '';

  const prs = [...board.prs].sort((a, b) => new Date(b.pr.updatedAt) - new Date(a.pr.updatedAt));
  $('#board').innerHTML = LANES.map((lane) => {
    const cards = prs.filter((p) => lane.statuses.includes(p.status));
    return `<section class="lane" data-lane="${lane.id}">
      <h2><span class="dot" style="border-color:${lane.color}"></span>${lane.label}<span class="count">${cards.length}</span></h2>
      ${cards.map(cardHtml).join('') || '<div class="muted" style="padding:4px">なし</div>'}
    </section>`;
  }).join('');

  if (openKey && $('#review-dlg').open) {
    const entry = board.prs.find((p) => p.key === openKey);
    if (!entry || entry.status !== 'reviewed') $('#review-dlg').close();
  }
}

function fmtTokens(n) {
  return n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
}

function cardHtml(e) {
  const pr = e.pr;
  const mapping = board.config.repos[pr.repo];
  const reviewed = new Set(pr.reviews.map((r) => r.login));
  const reviewers = [
    ...pr.reviews.map((r) => `<span class="rv" title="${esc(r.login)}: ${esc(r.state)}"><img class="avatar" src="${esc(r.avatarUrl)}" alt=""><span class="st">${REVIEW_ICON[r.state] || ''}</span></span>`),
    ...pr.requested.filter((r) => !reviewed.has(r.login)).map((r) => `<span class="rv pending" title="${esc(r.login)}: レビュー待ち"><img class="avatar" src="${esc(r.avatarUrl)}" alt=""></span>`),
  ].join('');

  let action = '';
  if (e.status === 'requested') {
    action = mapping?.skill
      ? `<button class="primary" data-review="${esc(e.key)}">レビューする</button><span class="muted">${esc(mapping.skill)}</span>`
      : `<button disabled>レビューする</button><a href="#" data-settings>スキル未設定</a>`;
    action += `<button data-skip="${esc(e.key)}" title="投稿せずに Done へ移す">スキップ</button>`;
  } else if (e.status === 'queued') {
    action = `<span class="muted"><span class="spin"></span> 待機中…</span><button data-cancel="${esc(e.key)}">${armedLabel(`cancel:${e.key}`, 'キャンセル', '本当にキャンセル？')}</button>`;
  } else if (e.status === 'reviewing') {
    action = `<span class="muted"><span class="spin"></span> レビュー中… (${ago(new Date(e.startedAt).toISOString())}に開始)</span><button data-cancel="${esc(e.key)}">${armedLabel(`cancel:${e.key}`, 'キャンセル', '本当にキャンセル？')}</button>`;
  } else if (e.status === 'reviewed') {
    action = `<span>${e.findings ? `指摘 ${e.findings.length} 件 — 判断する` : '原文を確認する'}</span>`;
  } else if (e.status === 'posting') {
    action = '<span class="muted"><span class="spin"></span> 投稿中…</span>';
  } else if (e.status === 'commented') {
    action = `${e.postedUrl ? `<a href="${esc(e.postedUrl)}" target="_blank" rel="noopener">投稿したレビュー</a>` : `<span class="muted">${e.skipped ? 'スキップ済み' : '投稿済み'}</span>`}<button data-dismiss="${esc(e.key)}" title="ボードから消す">×</button>`;
  }

  const clickable = e.status === 'reviewed';
  // Requested ⇄ Reviewing の D&D で レビューする / キャンセル と同じ操作をする
  const dragFrom = e.status === 'requested' ? (mapping?.skill ? 'requested' : null) : ['queued', 'reviewing'].includes(e.status) ? 'reviewing' : null;
  return `<article class="card${clickable ? ' clickable' : ''}" ${clickable ? `data-open="${esc(e.key)}"` : ''} ${dragFrom ? `draggable="true" data-drag="${esc(e.key)}" data-from="${dragFrom}"` : ''}>
    <div class="top">
      <img class="avatar" src="${esc(pr.author?.avatarUrl)}" alt="" title="${esc(pr.author?.login)}">
      <span class="grow"><a href="${esc(pr.url)}" target="_blank" rel="noopener">${esc(pr.repo.split('/')[1])} #${pr.number}</a></span>
      <span>${ago(pr.updatedAt)}</span>
    </div>
    <div class="title">${esc(pr.title)}</div>
    <div class="chips">
      ${pr.state === 'MERGED' ? `<span class="chip merged" title="${esc(new Date(pr.mergedAt).toLocaleString())}">Merged</span>` : ''}
      ${pr.isDraft ? '<span class="chip draft">Draft</span>' : ''}
      ${e.active === false ? '<span class="chip off">依頼解除済み</span>' : ''}
      ${e.usage ? `<span class="chip" title="このPRで使ったトークン (キャッシュ込み) と費用の累計">${fmtTokens(e.usage.tokens)} tok · $${e.usage.costUsd.toFixed(2)}</span>` : ''}
      ${e.error ? `<span class="chip err" title="${esc(e.error)}">エラー</span>` : ''}
      ${pr.labels.map((l) => `<span class="chip" style="border-color:#${esc(l.color)}">${esc(l.name)}</span>`).join('')}
    </div>
    ${pr.issues.map((i) => `<a class="issue" href="${esc(i.url)}" target="_blank" rel="noopener">◎ ${esc(i.repo.split('/')[1])} #${i.number} ${esc(i.title)}</a>`).join('')}
    <div class="reviewers">${reviewers}</div>
    ${e.error && e.status !== 'reviewed' ? `<div class="muted" style="color:var(--danger)">${esc(e.error)}</div>` : ''}
    <div class="actions">${action}</div>
  </article>`;
}

// ---------- 判断ダイアログ ----------

const draftKey = (key) => `review-board:decisions:${key}`;
function loadDraft(key) {
  try { return JSON.parse(localStorage.getItem(draftKey(key))) || {}; } catch { return {}; }
}
function saveDraft(key, draft) {
  try { localStorage.setItem(draftKey(key), JSON.stringify(draft)); } catch {}
}

function openReview(key) {
  openKey = key;
  const e = board.prs.find((p) => p.key === key);
  const draft = { decisions: {}, approve: false, humanRead: false, ...loadDraft(key) };
  const dlg = $('#review-dlg');
  const findings = e.findings;

  const renderDlg = () => {
    const decided = findings ? findings.filter((f) => draft.decisions[f.no]?.verdict).length : 0;
    const ready = findings && decided === findings.length;
    dlg.innerHTML = `
      <div class="dlg-head">
        <h3><a href="${esc(e.pr.url)}" target="_blank" rel="noopener">${esc(e.pr.repo.split('/')[1])} #${e.pr.number}</a> ${esc(e.pr.title)}</h3>
        <button data-close>閉じる</button>
      </div>
      <div class="dlg-body">
        ${e.error ? `<div class="banner" style="margin:0 0 12px">${esc(e.error)}</div>` : ''}
        ${e.summary ? `<p>${esc(e.summary)}</p>` : ''}
        ${findings ? (findings.length ? findings.map((f) => findingHtml(f, draft.decisions[f.no] || {})).join('') : '<p class="muted">指摘はありません。</p>')
          : `<pre class="raw">${esc(e.raw || '(出力なし)')}</pre>`}
        ${findings && e.raw ? `<details><summary class="muted">エージェントの原文</summary><pre class="raw">${esc(e.raw)}</pre></details>` : ''}
      </div>
      <div class="dlg-foot">
        <button data-rereview>再レビュー</button>
        <span style="flex:1"></span>
        ${findings ? `<span class="muted">${decided} / ${findings.length} 判断済み</span>` : ''}
        <label title="AI 任せのノールックレビューを防ぐため、自分でもコードを読んだらチェックしてください"><input type="checkbox" data-human-read ${draft.humanRead ? 'checked' : ''} ${findings ? '' : 'disabled'}> コードを読みました</label>
        <label><input type="checkbox" data-approve ${draft.approve ? 'checked' : ''} ${findings ? '' : 'disabled'}> Approve する</label>
        <button class="primary" data-submit ${ready ? '' : 'disabled'}>コメントする</button>
      </div>`;
  };

  dlg.onclick = async (ev) => {
    const t = ev.target;
    if (t.matches('[data-close]')) return dlg.close();
    if (t.matches('[data-verdict]')) {
      const no = t.dataset.no;
      draft.decisions[no] = { ...draft.decisions[no], verdict: t.dataset.verdict };
      saveDraft(key, draft);
      return renderDlg();
    }
    if (t.matches('[data-human-read]')) {
      draft.humanRead = t.checked;
      saveDraft(key, draft);
      return;
    }
    if (t.matches('[data-approve]')) {
      draft.approve = t.checked;
      saveDraft(key, draft);
      return;
    }
    if (t.matches('[data-rereview]')) {
      if (!confirmTwice(t, `rereview:${key}`, 'もう一度押すと判断を破棄して再レビュー')) return;
      saveDraft(key, {});
      dlg.close();
      return review(key);
    }
    if (t.matches('[data-submit]')) {
      const label = draft.approve ? 'もう一度押すと Approve で投稿' : 'もう一度押すと投稿';
      if (!confirmTwice(t, `submit:${key}`, label)) return;
      try {
        await api('/api/post', { method: 'POST', body: { key, decisions: draft.decisions, approve: draft.approve, humanRead: draft.humanRead } });
        saveDraft(key, {});
        dlg.close();
        load();
      } catch (err) {
        toast(err.message);
      }
    }
  };
  dlg.oninput = (ev) => {
    if (!ev.target.matches('[data-reason]')) return;
    const no = ev.target.dataset.no;
    draft.decisions[no] = { ...draft.decisions[no], reason: ev.target.value };
    saveDraft(key, draft);
  };

  renderDlg();
  dlg.showModal();
}

function findingHtml(f, d) {
  const loc = f.path ? `${f.path}${f.line ? `:${f.line}` : ''}` : '';
  const placeholder = d.verdict === 'disagree' ? '非同意の理由 (任意・書くと 🤔💭 付きで投稿されます)' : '理由・補足 (任意・コメント本文に反映されます)';
  return `<div class="finding ${esc(d.verdict || '')}">
    <div class="head"><strong>#${esc(f.no)}</strong>${f.severity ? `<span class="chip">${esc(f.severity)}</span>` : ''}<span class="grow">${esc(f.title)}</span></div>
    ${loc ? `<div class="muted">${esc(loc)}</div>` : ''}
    <pre>${esc(f.body)}</pre>
    <div class="verdict">
      <button class="agree ${d.verdict === 'agree' ? 'on' : ''}" data-verdict="agree" data-no="${esc(f.no)}">同意</button>
      <button class="disagree ${d.verdict === 'disagree' ? 'on' : ''}" data-verdict="disagree" data-no="${esc(f.no)}">非同意</button>
      <textarea data-reason data-no="${esc(f.no)}" placeholder="${placeholder}">${esc(d.reason || '')}</textarea>
    </div>
  </div>`;
}

// ---------- 設定ダイアログ ----------

async function openSettings() {
  const dlg = $('#settings-dlg');
  const cfg = structuredClone(board.config);
  const fetchSkills = async () => {
    const dirs = [cfg.workdir, ...Object.values(cfg.repos).map((m) => m.cwd)].filter(Boolean);
    return (await api(`/api/skills?${new URLSearchParams(dirs.map((d) => ['dir', d]))}`)).skills;
  };
  let skills = await fetchSkills();
  const repos = new Set([...Object.keys(cfg.repos), ...board.prs.map((p) => p.pr.repo)]);

  const skillOptions = (current) => {
    const list = skills.includes(current) || !current ? skills : [current, ...skills];
    return `<option value="">(未設定)</option>` + list.map((s) => `<option ${s === current ? 'selected' : ''}>${esc(s)}</option>`).join('');
  };
  const renderDlg = () => {
    dlg.innerHTML = `
      <div class="dlg-head"><h3>設定</h3><button data-close>閉じる</button></div>
      <div class="dlg-body">
        <div class="form-row"><label>作業ディレクトリ</label><input data-cfg="workdir" value="${esc(cfg.workdir)}"></div>
        <div class="form-row"><label>claude 追加引数</label><input data-cfg="claudeArgs" value="${esc(cfg.claudeArgs)}"></div>
        <div class="form-row"><label>マージ済み PR の表示日数</label><input data-cfg="mergedDays" type="number" min="0" value="${esc(cfg.mergedDays)}"></div>
        <div class="form-row"><label>同時実行数</label><input data-cfg="maxConcurrent" type="number" min="1" value="${esc(cfg.maxConcurrent)}"></div>
        <div class="form-row"><label>PR 作成者 (1 行 1 人、空なら全員)</label><textarea data-cfg="authors" rows="5" placeholder="alice&#10;dependabot[bot]">${esc((cfg.authors || []).join('\n'))}</textarea></div>
        <h4>リポジトリとスキルの対応</h4>
        <p class="muted">引数テンプレートで使える値: {number} {url} {repo} {owner} {fullRepo}。作業ディレクトリが空なら上の既定値で claude を起動します。スキル一覧は ~/.claude/skills と各作業ディレクトリの .claude/skills から探します。</p>
        <table class="repos">
          <thead><tr><th>リポジトリ</th><th>スキル</th><th>引数テンプレート</th><th>作業ディレクトリ</th></tr></thead>
          <tbody>
            ${[...repos].sort().map((r) => {
              const m = cfg.repos[r] || {};
              return `<tr>
                <td>${esc(r)}</td>
                <td><select data-repo="${esc(r)}" data-field="skill">${skillOptions(m.skill)}</select></td>
                <td><input data-repo="${esc(r)}" data-field="args" value="${esc(m.args || '{number}')}"></td>
                <td><input data-repo="${esc(r)}" data-field="cwd" value="${esc(m.cwd || '')}" placeholder="既定"></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <p><input id="new-repo" placeholder="owner/name"> <button data-add>リポジトリを追加</button></p>
      </div>
      <div class="dlg-foot"><span style="flex:1"></span><button class="primary" data-save>保存</button></div>`;
  };

  dlg.oninput = (ev) => {
    const t = ev.target;
    if (t.dataset.cfg === 'authors') cfg.authors = t.value.split('\n').map((s) => s.trim()).filter(Boolean);
    else if (t.dataset.cfg) cfg[t.dataset.cfg] = t.type === 'number' ? Number(t.value) : t.value;
    if (t.dataset.repo) cfg.repos[t.dataset.repo] = { args: '{number}', ...cfg.repos[t.dataset.repo], [t.dataset.field]: t.value };
  };
  // 作業ディレクトリを変えたらスキル候補を取り直す
  dlg.onchange = async (ev) => {
    if (ev.target.dataset.cfg !== 'workdir' && ev.target.dataset.field !== 'cwd') return;
    skills = await fetchSkills();
    renderDlg();
  };
  dlg.onclick = async (ev) => {
    const t = ev.target;
    if (t.matches('[data-close]')) return dlg.close();
    if (t.matches('[data-add]')) {
      const name = $('#new-repo').value.trim();
      if (/^[\w.-]+\/[\w.-]+$/.test(name)) repos.add(name);
      return renderDlg();
    }
    if (t.matches('[data-save]')) {
      await api('/api/config', { method: 'PUT', body: cfg });
      dlg.close();
      load();
    }
  };
  renderDlg();
  dlg.showModal();
}

// ---------- イベント ----------

async function review(key) {
  try {
    await api('/api/review', { method: 'POST', body: { key } });
  } catch (e) {
    toast(e.message);
  }
  load();
}

$('#board').addEventListener('click', async (ev) => {
  const t = ev.target;
  if (t.closest('a[target]')) return;
  if (t.matches('[data-review]')) return review(t.dataset.review);
  if (t.matches('[data-settings]')) { ev.preventDefault(); return openSettings(); }
  if (t.matches('[data-cancel]')) {
    if (!confirmTwice(t, `cancel:${t.dataset.cancel}`, '本当にキャンセル？')) return;
    try {
      await api('/api/cancel', { method: 'POST', body: { key: t.dataset.cancel } });
    } catch (e) {
      toast(e.message);
    }
    return load();
  }
  if (t.matches('[data-skip]')) {
    try {
      await api('/api/skip', { method: 'POST', body: { key: t.dataset.skip } });
    } catch (e) {
      toast(e.message);
    }
    return load();
  }
  if (t.matches('[data-dismiss]')) {
    await api('/api/dismiss', { method: 'POST', body: { key: t.dataset.dismiss } });
    return load();
  }
  const card = t.closest('[data-open]');
  if (card) openReview(card.dataset.open);
});

let dragging = null;
const DROP_TO = { requested: 'reviewing', reviewing: 'requested' };
const dropLane = (ev) => {
  const lane = ev.target.closest('[data-lane]');
  return dragging && lane?.dataset.lane === DROP_TO[dragging.from] ? lane : null;
};
$('#board').addEventListener('dragstart', (ev) => {
  const card = ev.target.closest('[data-drag]');
  if (!card) return;
  dragging = { key: card.dataset.drag, from: card.dataset.from };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', dragging.key);
});
$('#board').addEventListener('dragover', (ev) => {
  const lane = dropLane(ev);
  if (!lane) return;
  ev.preventDefault();
  lane.classList.add('drop');
});
$('#board').addEventListener('dragleave', (ev) => {
  const lane = ev.target.closest('[data-lane]');
  if (lane && !lane.contains(ev.relatedTarget)) lane.classList.remove('drop');
});
$('#board').addEventListener('drop', async (ev) => {
  const lane = dropLane(ev);
  if (!lane) return;
  ev.preventDefault();
  const { key, from } = dragging;
  dragging = null;
  if (from === 'requested') return review(key);
  try {
    await api('/api/cancel', { method: 'POST', body: { key } });
  } catch (e) {
    toast(e.message);
  }
  load();
});
$('#board').addEventListener('dragend', () => {
  if (!dragging) return;
  dragging = null;
  render();
});
$('#refresh').onclick = () => load(true);
$('#open-settings').onclick = openSettings;

load();
// ローカル状態は短い間隔で、GitHub はサーバー側の定期取得に任せる
setInterval(() => load(), POLL_LOCAL_MS);
</script>
</body>
</html>
