<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docket-gits</title>
<!-- Placeholder mascot (yellow duck, front view). To be replaced later -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%231f2328' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M30 9q1-6 7-5M33 9q3-3 6-1'/%3E%3Ccircle cx='32' cy='34' r='24' fill='%23f2c94c'/%3E%3Ccircle cx='23' cy='29' r='3.2' fill='%231f2328' stroke='none'/%3E%3Ccircle cx='41' cy='29' r='3.2' fill='%231f2328' stroke='none'/%3E%3Ccircle cx='24' cy='28' r='1' fill='%23fff' stroke='none'/%3E%3Ccircle cx='42' cy='28' r='1' fill='%23fff' stroke='none'/%3E%3Cellipse cx='32' cy='39' rx='9' ry='5' fill='%23f2994a'/%3E%3Cpath d='M24 39h16'/%3E%3Ccircle cx='15' cy='37' r='3' fill='%23f4a6a6' stroke='none'/%3E%3Ccircle cx='49' cy='37' r='3' fill='%23f4a6a6' stroke='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <h1><a href="#"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M30 9q1-6 7-5M33 9q3-3 6-1"/><circle cx="32" cy="34" r="24" fill="#f2c94c"/><circle cx="23" cy="29" r="3.2" fill="#1f2328" stroke="none"/><circle cx="41" cy="29" r="3.2" fill="#1f2328" stroke="none"/><circle cx="24" cy="28" r="1" fill="#fff" stroke="none"/><circle cx="42" cy="28" r="1" fill="#fff" stroke="none"/><ellipse cx="32" cy="39" rx="9" ry="5" fill="#f2994a"/><path d="M24 39h16"/><circle cx="15" cy="37" r="3" fill="#f4a6a6" stroke="none"/><circle cx="49" cy="37" r="3" fill="#f4a6a6" stroke="none"/></svg>docket-gits</a></h1>
  <nav class="tabs"><a href="#review" data-view="review"><span data-i18n="tab.review"></span><span class="badges"></span></a><a href="#receive" data-view="receive"><span data-i18n="tab.receive"></span><span class="badges"></span></a><a href="#plan" data-view="plan"><span data-i18n="tab.roadmap"></span></a></nav>
  <span class="grow"></span>
  <details class="user-menu"><summary id="viewer"></summary><nav><a href="#settings" data-i18n="settings"></a><a href="#tips">Tip</a><a href="#about">About</a></nav></details>
</header>
<div id="banner"></div>
<div class="board-view" id="board-view">
<aside class="pl-side" id="board-side">
  <div class="pl-side-top"><span class="ms-label" data-i18n="sideData"></span><button class="pl-fold" id="board-fold"></button></div>
  <button id="refresh" class="refetch"></button>
  <span class="pl-rail" data-i18n="filter"></span>
  <details class="side-fold side-view side-sec" id="board-view-sec"><summary><span class="ms-label" data-i18n="sideView"></span></summary>
  <div class="board-bar" id="board-bar">
    <button id="stack-order" data-i18n="stackOrder" data-i18n-title="stackOrder.title"></button>
    <button id="edit-lanes" data-i18n="editLanes"></button>
    <button id="card-display" data-i18n="cardDisplay"></button>
    <button id="archive-toggle"></button>
    <button id="lane-save" class="primary" hidden data-i18n="save"></button>
    <button id="lane-cancel" hidden data-i18n="cancel"></button>
  </div>
  </details>
  <details class="side-fold side-filter side-sec" id="board-filter"><summary><span class="ms-label" data-i18n="filter"></span><span class="side-dot"></span></summary>
    <div id="repo-filter" class="board-filters"></div>
  </details>
</aside>
<main class="board" id="board"></main>
</div>
<main id="plan" hidden></main>
<main id="home" class="home" hidden></main>
<main id="about" class="about" hidden></main>
<main id="tips" class="page" hidden>
  <h2>Tip</h2>
  <details class="tip" open data-i18n-html="tips.lanes" data-shots="review,receive"></details>
  <details class="tip" data-i18n-html="tips.review" data-shots="findings,triage"></details>
  <details class="tip" data-i18n-html="tips.buttons" data-shots="bar"></details>
  <details class="tip" data-i18n-html="tips.home"></details>
  <details class="tip" data-i18n-html="tips.html"></details>
  <details class="tip" data-i18n-html="tips.roadmap"></details>
  <details class="tip" data-i18n-html="tips.settings"></details>
  <details class="tip" data-i18n-html="tips.cost" data-shots="cost"></details>
  <details class="tip" data-i18n-html="tips.trouble"></details>
  <button data-open-consent data-i18n="consent.open"></button>
</main>
<main id="settings" class="page" hidden></main>
<footer class="site-foot"><a href="https://github.com/ruridev/docket-gits" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a></footer>

<dialog id="review-dlg"></dialog>
<dialog id="plan-dlg"></dialog>
<dialog id="log-dlg">
  <form method="dialog" class="dlg-head"><h3 data-i18n="claudeOutput"></h3><button data-i18n="close"></button></form>
  <pre class="dlg-body log"></pre>
</dialog>
<dialog id="consent-dlg">
  <div class="dlg-head"><h3 data-i18n="consent.title"></h3><button data-close data-i18n="close"></button></div>
  <div class="dlg-body consent" data-i18n-html="consent.html"></div>
  <div class="dlg-foot"><span style="flex:1"></span><button class="primary" data-agree data-i18n="consent.agree"></button></div>
</dialog>
<dialog id="display-dlg">
  <div class="dlg-head"><h3 data-i18n="cardDisplay"></h3><span style="flex:1"></span><button data-close data-i18n="close"></button></div>
  <div class="dlg-body"></div>
  <div class="dlg-foot" hidden><span style="flex:1"></span><button data-copy="" data-i18n="cd.no"></button><button class="primary" data-copy="1" data-i18n="cd.yes"></button></div>
</dialog>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="plan.js"></script>
<script src="main.js"></script>
</body>
</html>
