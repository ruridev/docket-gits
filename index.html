    else {
      providerChoice.button = button;
      button.setAttribute('aria-expanded', 'true');
    }
  }
  const ni = nameAt && $(`#board [data-lane-name="${nameAt[0]}"]`);
  if (ni) { ni.focus(); ni.setSelectionRange(nameAt[1], nameAt[2]); }

  if (openKey && $('#review-dlg').open) {
    const entry = [...board.prs, ...board.mine].find((p) => p.key === openKey);
    if (!entry || !['reviewed', 'planned'].includes(entry.status)) $('#review-dlg').close();
  }
}

// メイン画面: 取得済みのボードのデータだけで件数をまとめる (GitHub への追加の問い合わせはしない)
const formatCost = (cost) => cost == null ? tr('costUnknown') : `$${cost.toFixed(2)}`;
function renderHome() {
  const count = (v, l) => (v === 'receive' ? board.mine : board.prs).filter(laneMatch(l)).length;
  const lanesSection = (v, title) => {
    const rows = lanesFor(v).map((l) => [l, count(v, l)]);
    const max = Math.max(1, ...rows.map(([, n]) => n));
    return `<section><h2>${title}<span class="muted">${tr('home.total', { n: v === 'receive' ? board.mine.length : board.prs.length })}</span><a href="#${v}">${tr('home.open')}</a></h2>
      ${rows.map(([l, n]) => `<div class="row"><span>${esc(laneLabel(v, l))}</span><span class="bar"><i style="width:${(n / max) * 100}%;background:${l.color}"></i></span><b>${n}</b></div>`).join('')}</section>`;
  };
  const left = board.prs.filter((p) => p.status !== 'commented');
  const byRepo = Object.entries(left.reduce((m, p) => ({ ...m, [p.pr.repo]: (m[p.pr.repo] || 0) + 1 }), {})).sort((a, b) => b[1] - a[1]);
  const maxRepo = Math.max(1, ...byRepo.map(([, n]) => n));
  const all = [...board.prs, ...board.mine];
  const usage = (list) => list.reduce((u, p) => ({ tokens: u.tokens + (p.usage?.tokens || 0), costUsd: u.costUsd == null || (p.usage && p.usage.costUsd == null) ? null : u.costUsd + (p.usage?.costUsd || 0) }), { tokens: 0, costUsd: 0 });
  const total = usage(all);
  const kpi = (n, label, href) => (href ? `<a class="kpi" href="${href}">` : '<div class="kpi">') + `<div class="n">${n}</div><div class="l">${label}</div>` + (href ? '</a>' : '</div>');
  $('#home').innerHTML = `<div class="kpis">
      ${kpi(left.length, tr('home.left'), '#review')}
      ${kpi(board.prs.filter((p) => p.status === 'reviewed').length + board.mine.filter((p) => p.status === 'planned').length, tr('home.decide'), board.mine.some((p) => p.status === 'planned') && !board.prs.some((p) => p.status === 'reviewed') ? '#receive' : '#review')}
      ${kpi(board.mine.reduce((n, p) => n + (p.pending || 0), 0), tr('home.comments'), '#receive')}
      ${kpi(formatCost(total.costUsd), tr('home.cost'))}
    </div>
    <div class="cols">${lanesSection('review', tr('tab.review'))}${lanesSection('receive', tr('tab.receive'))}</div>
    <div class="cols">
      <section><h2>${tr('home.byRepo')}</h2>${byRepo.map(([r, n]) => `<div class="row"><span>${esc(r.split('/')[1])}</span><span class="bar"><i style="width:${(n / maxRepo) * 100}%;background:var(--accent)"></i></span><b>${n}</b></div>`).join('') || `<div class="muted">${tr('none')}</div>`}</section>
      <section><h2>${tr('home.usage')}</h2>
        ${[[tr('tab.review'), usage(board.prs)], [tr('tab.receive'), usage(board.mine)]].map(([l, u]) => `<div class="row" style="grid-template-columns:minmax(90px, auto) 1fr auto"><span>${l}</span><span class="muted">${fmtTokens(u.tokens)} tok</span><b>${formatCost(u.costUsd)}</b></div>`).join('')}
        <div class="muted" style="font-size:12px;margin-top:6px">${tr('home.usageNote')}</div></section>
    </div>`;
}

const fmtBytes = (n) => (n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)}MB` : `${Math.ceil(n / 1024)}KB`);

function fmtTokens(n) {
  return n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
}

function cardHtml(e) {
  const mapping = toolMapping(board.config.repos[e.pr.repo], board.config.provider || 'claude');
  let action = '';
  if (e.status === 'requested') {
    action = hasToolSkill(e.pr.repo, 'review')
      ? `${runButton(tr('btn.review'), e, 'review', true)}<span class="muted">${esc(skillLabel(mapping.skill || tr('unset')))}</span>`
      : `<button disabled>${tr('btn.review')}</button><a href="#settings" data-settings>${tr('skillMissing')}</a>`;
    action += `<button data-skip="${esc(e.key)}" title="${esc(tr('skip.title'))}">${tr('skip')}</button>`;
  } else if (e.status === 'queued') {
    action = `<span class="muted"><span class="spin"></span> ${tr('queued')}</span><button data-cancel="${esc(e.key)}">${armedLabel(`cancel:${e.key}`, tr('cancel'), tr('confirmCancel'))}</button>`;
  } else if (e.status === 'reviewing') {
    action = `<span class="muted"><span class="spin"></span> ${tr('reviewing')} ${tr('startedAgo', { ago: ago(e.startedAt) })}</span><button data-log="${esc(e.key)}">${tr('log')}</button><button data-cancel="${esc(e.key)}">${armedLabel(`cancel:${e.key}`, tr('cancel'), tr('confirmCancel'))}</button>`;
  } else if (e.status === 'reviewed') {
    action = `<span>${e.findings ? tr('findingsDecide', { n: e.findings.length }) : tr('checkRaw')} · ${providerLabel(e.provider)}</span>`;
  } else if (e.status === 'posting') {
    action = `<span class="muted"><span class="spin"></span> ${tr('posting')}</span><button data-log="${esc(e.key)}">${tr('log')}</button>`;
  } else if (e.status === 'commented') {
    action = `${e.postedUrl ? `<a href="${esc(safeUrl(e.postedUrl))}" target="docket-viewer">${tr('postedReview')}</a>` : `<span class="muted">${e.skipped ? tr('skipped') : tr('posted')}</span>`}<button data-dismiss="${esc(e.key)}" title="${esc(tr('dismiss.title'))}">×</button>`;
  }

  const clickable = e.status === 'reviewed';
  // Requested ⇄ Reviewing の D&D で レビューする / キャンセル、Requested・Reviewed → Done で投稿せずに終える
  const dragFrom = ['requested', 'reviewed'].includes(e.status) ? e.status : ['queued', 'reviewing'].includes(e.status) ? 'reviewing' : null;
  return cardShell(e, action, `class="card${clickable ? ' clickable' : ''}" ${clickable ? `data-open="${esc(e.key)}"` : ''} ${dragFrom ? `draggable="true" data-drag="${esc(e.key)}" data-from="${dragFrom}"` : ''}`, e.status !== 'reviewed');
}

const MINE_RUNNING = { self: tr('running.self'), fix: tr('running.fix') };
const toolMapping = (mapping = {}, provider) => provider === 'codex' ? mapping.codex || {} : mapping;
const actionSkill = (repo, action, provider) => toolMapping(board.config.repos[repo], provider)[{ review: 'skill', self: 'selfSkill', fix: 'fixSkill' }[action]];
const hasToolSkill = (repo, action) => ['claude', 'codex'].some((p) => actionSkill(repo, action, p));
function runButton(label, entry, action, primary = false) {
  const attrs = `data-run-action="${action}" data-key="${esc(entry.key)}" data-run-repo="${esc(entry.pr.repo)}"`;
  const current = board.config.provider || 'claude';
  const available = actionSkill(entry.pr.repo, action, current);
  return `<span class="run-split"><button ${attrs} class="${primary ? 'primary' : ''}" title="${esc(available ? tr('runWith', { tool: providerLabel(current) }) : tr('skillMissing'))}" ${available ? '' : 'disabled'}>${label}</button><button ${attrs} data-provider-toggle aria-haspopup="dialog" aria-controls="provider-menu" aria-expanded="false" aria-label="${esc(tr('chooseProvider'))}"><span class="run-chevron" aria-hidden="true"></span></button></span>`;
}
const providerLabel = (p) => p === 'codex' ? 'Codex' : 'Claude';
let providerChoice = null;
const providerMenu = document.createElement('div');
providerMenu.id = 'provider-menu';
providerMenu.popover = 'auto';
providerMenu.setAttribute('role', 'dialog');
document.body.append(providerMenu);
providerMenu.addEventListener('toggle', () => {
  if (!providerMenu.matches(':popover-open')) {
    providerChoice?.button?.setAttribute('aria-expanded', 'false');
    providerChoice = null;
  }
});
providerMenu.addEventListener('keydown', (ev) => {
  const buttons = [...providerMenu.querySelectorAll('button:not(:disabled)')];
  const index = buttons.indexOf(document.activeElement);
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    buttons[(index + (ev.key === 'ArrowDown' ? 1 : buttons.length - 1)) % buttons.length].focus();
  } else if (ev.key === 'Escape') {
    ev.preventDefault();
    providerChoice?.button?.setAttribute('aria-expanded', 'false');
    providerChoice?.button?.focus();
    providerMenu.hidePopover();
  }
});
document.addEventListener('scroll', () => {
  if (providerMenu.matches(':popover-open')) providerMenu.hidePopover();
}, true);
window.addEventListener('resize', () => {
  if (providerMenu.matches(':popover-open')) providerMenu.hidePopover();
});
function startAction(key, action, provider) {
  return action === 'review' ? review(key, provider) : action === 'fix' ? openTriage(key, provider) : runMine(key, action, undefined, provider);
}
document.addEventListener('click', (ev) => {
  const button = ev.target.closest('[data-run-action], [data-provider-pick]');
  if (!button || button.disabled) return;
  ev.stopPropagation();
  if (button.hasAttribute('data-provider-pick')) {
    const { key, action } = providerChoice;
    providerMenu.hidePopover();
    return startAction(key, action, button.dataset.providerPick);
  }
  const { key, runAction: action, runRepo: repo } = button.dataset;
  if (!button.hasAttribute('data-provider-toggle')) return startAction(key, action, board.config.provider || 'claude');
  if (providerMenu.matches(':popover-open')) {
    const same = providerChoice?.key === key && providerChoice?.action === action;
    providerMenu.hidePopover();
    if (same) return;
  }
  providerChoice = { key, action, button };
  providerMenu.setAttribute('aria-label', tr('chooseProvider'));
  providerMenu.innerHTML = ['claude', 'codex'].map((p) => `<button data-provider-pick="${p}" ${actionSkill(repo, action, p) ? '' : 'disabled'}>${providerLabel(p)}${p === (board.config.provider || 'claude') ? ` · ${tr('defaultParen')}` : ''}${actionSkill(repo, action, p) ? '' : ` · ${tr('unset')}`}</button>`).join('');
  const rect = button.parentElement.getBoundingClientRect();
  providerMenu.style.left = `${Math.max(4, Math.min(rect.left, innerWidth - 180))}px`;
  providerMenu.style.top = `${rect.bottom + 4}px`;
  button.setAttribute('aria-expanded', 'true');
  providerMenu.showPopover();
  providerMenu.querySelector('button:not(:disabled)').focus();
}, true);

function mineCardHtml(e) {
  const cancel = `<button data-mine-cancel="${esc(e.key)}">${armedLabel(`cancel:${e.key}`, tr('cancel'), tr('confirmCancel'))}</button>`;
  let action = '';
  if (e.status === 'idle') {
    const buttons = [
      hasToolSkill(e.pr.repo, 'self') && runButton(tr('selfReview'), e, 'self'),
      hasToolSkill(e.pr.repo, 'fix') && runButton(tr('fixComments'), e, 'fix'),
    ].filter(Boolean);
    action = buttons.length ? `<span class="btns">${buttons.join('')}</span>` : `<a href="#settings" data-settings>${tr('skillMissing')}</a>`;
  } else if (e.status === 'queued') {
    action = `<span class="muted"><span class="spin"></span> ${tr('queued')}</span>${cancel}`;
  } else if (e.status === 'running') {
    action = `<span class="muted"><span class="spin"></span> ${MINE_RUNNING[e.mode]} ${tr('startedAgo', { ago: ago(e.startedAt) })}</span><button data-log="${esc(e.key)}">${tr('log')}</button>${cancel}`;
  } else if (e.status === 'planned') {
    action = `<span>${e.findings ? tr('findingsDecide', { n: e.findings.length }) : tr('checkRaw')} · ${providerLabel(e.provider)}</span>`;
  } else if (e.status === 'applying') {
    action = `<span class="muted"><span class="spin"></span> ${tr('applying')}</span><button data-log="${esc(e.key)}">${tr('log')}</button>`;
  }
  const clickable = e.status === 'planned';
  // 自分の PR ⇄ マージ可能 ⇄ Done の D&D で手動で移す。判断待ちは実行中に移すと PR 上のコメントどおりに対応する
  const dragFrom = e.status === 'planned' && e.sessionId ? 'planned' : e.status === 'idle' && !e.pending && (e.done || !e.pr.isDraft) ? (e.done ? 'done' : e.mergeReady ? 'mergeable' : 'mine') : null;
  return cardShell(e, action, `class="card${clickable ? ' clickable' : ''}" ${clickable ? `data-open-mine="${esc(e.key)}"` : ''} ${dragFrom ? `draggable="true" data-drag="${esc(e.key)}" data-from="${dragFrom}"` : ''}`, e.status !== 'planned');
}

// ボード上の同じリポジトリの PR で、base = 相手の head なら積まれている関係。親 → 自分 → 子 の順に並べる
// 複数選択のドロップダウン (文字で絞り込める)。開閉と検索語は再描画をまたいで保つ
// items: [{ value, text, img? }]、summary と extra (一覧の下に足す欄) はエスケープ済み HTML
const msQuery = {};
// 選択欄の上に小さいラベルを付ける
const field = (label, html) => `<div class="ms-field"><span class="ms-label">${label}</span>${html}</div>`;
function multiSelect(key, label, summary, items, isOn, extra = '') {
  const open = document.querySelector(`details.ms[data-ms="${key}"]`)?.open;
  const q = (msQuery[key] || '').toLowerCase();
  return field(label, `<details class="ms" data-ms="${key}"${open ? ' open' : ''}><summary>${summary}</summary><div class="ms-pop">
    <input type="search" data-ms-q placeholder="${esc(tr('search'))}" value="${esc(msQuery[key] || '')}">
    <div class="ms-list">${items.map((i) => `<label data-ms-text="${esc(i.text.toLowerCase())}"${i.text.toLowerCase().includes(q) ? '' : ' hidden'} title="${esc(i.value)}"${i.disabled ? ' class="off"' : ''}><input type="checkbox" data-ms-value="${esc(i.value)}"${i.disabled ? ' disabled' : isOn(i.value) ? ' checked' : ''}>${i.img ? `<img class="avatar" src="${esc(i.img)}" alt="">` : ''}${esc(i.text)}</label>`).join('')}</div>
    <div class="ms-bulk"><button data-ms-bulk="all">${tr('selectAll')}</button><button data-ms-bulk="none">${tr('clearAll')}</button></div>${extra}</div></details>`);
}
document.addEventListener('input', (ev) => {
  if (!ev.target.matches('[data-ms-q]')) return;
  const ms = ev.target.closest('.ms');
  const q = (msQuery[ms.dataset.ms] = ev.target.value).toLowerCase();
  for (const l of ms.querySelectorAll('[data-ms-text]')) l.hidden = !l.dataset.msText.includes(q);
});
// 外側をクリックしたら閉じる
document.addEventListener('click', (ev) => {
  for (const d of document.querySelectorAll('details.ms[open], .user-menu[open]')) if (!d.contains(ev.target) || ev.target.closest('.user-menu a')) d.open = false;
});

const prId = (pr) => `${pr.repo}#${pr.number}`;
function stackHtml(pr) {
  const all = new Map([...board.prs, ...board.mine].map((p) => [prId(p.pr), p.pr]));
  const same = [...all.values()].filter((p) => p.repo === pr.repo && p.number !== pr.number);
  const parents = same.filter((p) => p.head === pr.base);
  const children = same.filter((p) => p.base === pr.head);
  if (!parents.length && !children.length) return '';
  const links = (ps) => ps.map((p) => `<a href="${esc(safeUrl(p.url))}" target="docket-viewer" data-jump="${esc(prId(p))}" title="${esc(p.title)}">#${p.number}</a>`).join(', ');
  return `<div class="stack">${tr('stack')}${[links(parents), `<b>#${pr.number}</b>`, links(children)].filter(Boolean).join(' → ')}</div>`;
}

// レーン内のカードをスタックごとにまとめ、親 → 子 → 孫 の順にする。親がレーン内にないカードを起点に、更新順を保って辿る
let stackOrder = false;
function stackSort(cards) {
  const isChild = (c, p) => c !== p && c.pr.repo === p.pr.repo && c.pr.base === p.pr.head;
  const out = [];
  const seen = new Set();
  const visit = (c) => {
    if (seen.has(c)) return;
    seen.add(c);
    out.push(c);
    cards.filter((x) => isChild(x, c)).forEach(visit);
  };
  cards.filter((c) => !cards.some((p) => isChild(c, p))).forEach(visit);
  cards.forEach(visit); // 循環していて起点がないもの
  return out;
}

// スタックのリンク先カードを一時的に強調する。再描画されても消えないよう状態で持つ
let highlight = null;
// 右のタブ (docket-viewer) で最後に開いたリンクのカード
let viewing = null;
function jumpTo(id) {
  highlight = id;
  render();
  $(`#board [data-pr="${CSS.escape(id)}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => { if (highlight === id) { highlight = null; render(); } }, 3000);
}

function cardShell(e, action, attrs, showError) {
  const pr = e.pr;
  const reviewed = new Set(pr.reviews.map((r) => r.login));
  const reviewers = [
    ...pr.reviews.map((r) => `<span class="rv" title="${esc(r.login)}: ${esc(r.state)}"><img class="avatar" src="${esc(r.avatarUrl)}" alt=""><span class="st">${REVIEW_ICON[r.state] || ''}</span></span>`),
    ...pr.requested.filter((r) => !reviewed.has(r.login)).map((r) => `<span class="rv pending" title="${esc(r.login)}: ${tr('rv.pending')}"><img class="avatar" src="${esc(r.avatarUrl)}" alt=""></span>`),
  ].join('');
  return `<article ${attrs.replace('class="card', `data-pr="${esc(prId(pr))}" class="card${highlight === prId(pr) ? ' hl' : ''}${viewing === prId(pr) ? ' viewing' : ''}`)}>
    <div class="top">
      ${view() === 'receive' ? '' : `<img class="avatar" src="${esc(pr.author?.avatarUrl)}" alt="" title="${esc(pr.author?.login)}">`}
      <span class="grow"><a href="${esc(safeUrl(pr.url))}" target="docket-viewer">${esc(pr.repo.split('/')[1])} #${pr.number}</a></span>
      <span class="time" title="${esc(new Date(pr.updatedAt).toLocaleString(lang))}">${tr('fetchedAgo', { ago: ago(pr.updatedAt) })}</span>
    </div>
    <div class="title">${esc(pr.title)}${e.pending ? `<span class="pending-dot" role="img" aria-label="${esc(tr('pending.title'))}"></span>` : ''}</div>
    ${pr.base ? `<div class="branch" title="base ← head">${esc(pr.base)} ← ${esc(pr.head)}</div>` : ''}
    <div class="chips">
      ${e.provider ? `<span class="chip">${providerLabel(e.provider)}</span>` : ''}
      ${pr.state === 'MERGED' ? `<span class="chip merged" title="${esc(new Date(pr.mergedAt).toLocaleString(lang))}">Merged</span>` : ''}
      ${e.active === false ? `<span class="chip off">${tr('requestRemoved')}</span>` : ''}
      ${e.error ? `<span class="chip err" title="${esc(errText(e.error))}">${tr('error')}</span>` : ''}
      ${pr.labels.map((l) => `<span class="chip" style="border-color:#${esc(l.color)}">${esc(l.name)}</span>`).join('')}
    </div>
    ${stackHtml(pr)}
    ${pr.issues.map((i) => `<a class="issue" href="${esc(safeUrl(i.url))}" target="docket-viewer">◎ ${esc(i.repo.split('/')[1])} #${i.number} ${esc(i.title)}</a>`).join('')}
    <div class="reviewers">${reviewers}</div>
    ${e.error && showError ? `<div class="muted" style="color:var(--danger)">${esc(errText(e.error))}${e.lastLog && !e.run ? ` <button data-log="${esc(e.key)}">${tr('log')}</button>` : ''}</div>` : ''}
    ${e.usage || (e.status === 'idle' && e.appliedAt) ? `<div class="chips foot">
      ${e.usage ? `<span class="usage" title="${esc(tr('usage.title'))}">${fmtTokens(e.usage.tokens)} tok · ${formatCost(e.usage.costUsd)}</span>` : ''}
      ${e.status === 'idle' && e.appliedAt ? `<span class="time" title="${esc(new Date(e.appliedAt).toLocaleString(lang))}">${tr('appliedAgo', { ago: ago(e.appliedAt) })}</span>` : ''}
    </div>` : ''}
    <div class="actions">${action}</div>
  </article>`;
}

// ---------- 判断ダイアログ ----------

const draftKey = (key) => `docket:decisions:${key}`;
function loadDraft(key) {
  try { return JSON.parse(localStorage.getItem(draftKey(key))) || {}; } catch { return {}; }
}
function saveDraft(key, draft) {
  try { localStorage.setItem(draftKey(key), JSON.stringify(draft)); } catch {}
}

function openReview(key) {
  openKey = key;
  const e = board.prs.find((p) => p.key === key);
  const draft = { decisions: {}, approve: false, humanRead: false, ...loadDraft(key) };
  const dlg = $('#review-dlg');
  const findings = e.findings;

  const renderDlg = () => {
    const decided = findings ? findings.filter((f) => draft.decisions[f.no]?.verdict).length : 0;
    const ready = findings && decided === findings.length;
    dlg.innerHTML = `
      <div class="dlg-head">
        <h3><a href="${esc(safeUrl(e.pr.url))}" target="docket-viewer">${esc(e.pr.repo.split('/')[1])} #${e.pr.number}</a> ${esc(e.pr.title)}</h3>
        <button data-close>${tr('close')}</button>
      </div>
      <div class="dlg-body">
        ${e.error ? `<div class="banner" style="margin:0 0 12px">${esc(errText(e.error))}</div>` : ''}
        ${e.summary ? `<p>${esc(e.summary)}</p>` : ''}
        ${findings ? (findings.length ? findings.map((f) => findingHtml(f, draft.decisions[f.no] || {}, undefined, true)).join('') : `<p class="muted">${tr('noFindings')}</p>`)
          : `<pre class="raw">${esc(e.raw || tr('noOutput'))}</pre>`}
        ${findings && e.raw ? `<details><summary class="muted">${tr('agentRaw')}</summary><pre class="raw">${esc(e.raw)}</pre></details>` : ''}
      </div>
      <div class="dlg-foot">
        <button data-rereview>${tr('rereview')}</button>
        <button data-skip-dlg title="${esc(tr('skip.title'))}">${tr('skip')}</button>
        ${e.lastLog ? `<button data-log="${esc(key)}">${tr('log')}</button>` : ''}
        <span style="flex:1"></span>
        ${findings ? `<span class="muted">${tr('decided', { n: decided, total: findings.length })}</span>` : ''}
        <label title="${esc(tr('humanRead.title'))}"><input type="checkbox" data-human-read ${draft.humanRead ? 'checked' : ''} ${findings ? '' : 'disabled'}> ${tr('humanRead')}</label>
        <label><input type="checkbox" data-approve ${draft.approve ? 'checked' : ''} ${findings ? '' : 'disabled'}> ${tr('approve')}</label>
        <button class="primary" data-submit ${ready ? '' : 'disabled'}>${tr('submit')}</button>
      </div>`;
  };

  dlg.onclick = async (ev) => {
    const t = ev.target;
    if (t.matches('[data-close]')) return dlg.close();
    if (t.matches('[data-log]')) return openLog(key);
    if (t.matches('[data-verdict]')) {
      const no = t.dataset.no;
      draft.decisions[no] = { ...draft.decisions[no], verdict: t.dataset.verdict };
      saveDraft(key, draft);
      return renderDlg();
    }
    if (t.matches('[data-human-read]')) {
      draft.humanRead = t.checked;
      saveDraft(key, draft);
      return;
    }
    if (t.matches('[data-approve]')) {
      draft.approve = t.checked;
      saveDraft(key, draft);
      return;
    }
    if (t.matches('[data-skip-dlg]')) {
      try {
        await api('/api/skip', { method: 'POST', body: { key } });
        saveDraft(key, {});
        dlg.close();
        load();
      } catch (err) {
        toast(err.message);
      }
      return;
    }
    if (t.matches('[data-rereview]')) {
      if (!confirmTwice(t, `rereview:${key}`, tr('confirmRereview'))) return;
      saveDraft(key, {});
      dlg.close();
      return review(key);
    }
    if (t.matches('[data-submit]')) {
      const label = draft.approve ? tr('confirmApprove') : tr('confirmPost');
      if (!confirmTwice(t, `submit:${key}`, label)) return;
      try {
        await api('/api/post', { method: 'POST', body: { key, decisions: draft.decisions, approve: draft.approve, humanRead: draft.humanRead } });
        saveDraft(key, {});
        dlg.close();
        load();
      } catch (err) {
        toast(err.message);
      }
    }
  };
  dlg.oninput = (ev) => {
    if (!ev.target.matches('[data-reason]')) return;
    const no = ev.target.dataset.no;
    draft.decisions[no] = { ...draft.decisions[no], reason: ev.target.value };
    saveDraft(key, draft);
  };

  renderDlg();
  dlg.showModal();
}

// server.js の PROMPT_SKILL と同じ値。スキルではなく設定のレビュープロンプトを使う
const PROMPT_SKILL = '(prompt)';
const skillLabel = (s) => (s === PROMPT_SKILL ? tr('opt.prompt') : s);
const disagreeIcon = () => board.config?.disagreeIcon?.trim() || '🤔💭';
function findingHtml(f, d, placeholders = { agree: tr('ph.agree'), disagree: tr('ph.disagree', { icon: disagreeIcon() }) }, skippable = false) {
  const loc = f.path ? `${f.path}${f.line ? `:${f.line}` : ''}` : '';
  const placeholder = d.verdict === 'disagree' ? placeholders.disagree : placeholders.agree;
  return `<div class="finding ${esc(d.verdict || '')}">
    <div class="head"><strong>#${esc(f.no)}</strong>${f.severity ? `<span class="chip">${esc(f.severity)}</span>` : ''}<span class="grow">${esc(f.title)}</span></div>
    ${loc || f.url ? `<div class="muted">${esc(loc)} ${f.url ? `<a href="${esc(safeUrl(f.url))}" target="docket-viewer">${tr('origComment')}</a>` : ''}</div>` : ''}
    <pre>${esc(f.body)}</pre>
    <div class="verdict">
      <button class="agree ${d.verdict === 'agree' ? 'on' : ''}" data-verdict="agree" data-no="${esc(f.no)}">${tr('agree')}</button>
      <button class="disagree ${d.verdict === 'disagree' ? 'on' : ''}" data-verdict="disagree" data-no="${esc(f.no)}">${tr('disagree')}</button>
      ${skippable ? `<button class="skip ${d.verdict === 'skip' ? 'on' : ''}" data-verdict="skip" data-no="${esc(f.no)}">${tr('notApplicable')}</button>` : ''}
      <textarea data-reason data-no="${esc(f.no)}" placeholder="${esc(placeholder)}">${esc(d.reason || '')}</textarea>
    </div>
  </div>`;
}

const MINE_PLACEHOLDER = {
  self: { agree: tr('ph.self.agree'), disagree: tr('ph.self.disagree') },
  fix: { agree: tr('ph.fix.agree'), disagree: tr('ph.fix.disagree') },
};

// review-fix の対応計画を指摘カードの形にそろえる
function planToFinding(item) {
  return {
    ...item,
    severity: item.category,
    title: `${item.author ? `@${item.author}: ` : ''}${item.comment || ''}`,
    body: [
      item.category === 'rebut' && item.ownReason && `${tr('planOwnReason')}\n${item.ownReason}`,
      item.rebuttal && `${tr('planRebut')}\n${item.rebuttal}`,
      item.plan && `${tr('planFix')}\n${item.plan}`,
      item.reply && `${tr('planReply')}\n${item.reply}`,
    ].filter(Boolean).join('\n\n'),
  };
}

function openMine(key) {
  openKey = key;
  const e = board.mine.find((p) => p.key === key);
  const draft = { decisions: {}, confirmed: false, ...loadDraft(key) };
  const dlg = $('#review-dlg');
  const findings = e.findings && (e.mode === 'fix' ? e.findings.map(planToFinding) : e.findings);
  const runLabel = e.mode === 'self' ? tr('rerunSelf') : tr('rerunFix');

  const renderDlg = () => {
    const decided = findings ? findings.filter((f) => draft.decisions[f.no]?.verdict).length : 0;
    const ready = findings && decided === findings.length && draft.confirmed;
    dlg.innerHTML = `
      <div class="dlg-head">
        <h3><a href="${esc(safeUrl(e.pr.url))}" target="docket-viewer">${esc(e.pr.repo.split('/')[1])} #${e.pr.number}</a> ${esc(e.pr.title)}</h3>
        <button data-close>${tr('close')}</button>
      </div>
      <div class="dlg-body">
        <p class="muted">${e.mode === 'self' ? tr('desc.self') : tr('desc.fix')}</p>
        ${e.error ? `<div class="banner" style="margin:0 0 12px">${esc(errText(e.error))}</div>` : ''}
        ${e.summary ? `<p>${esc(e.summary)}</p>` : ''}
        ${findings ? (findings.length ? findings.map((f) => findingHtml(f, draft.decisions[f.no] || {}, MINE_PLACEHOLDER[e.mode])).join('') : `<p class="muted">${tr('noMineFindings')}</p>`)
          : `<pre class="raw">${esc(e.raw || tr('noOutput'))}</pre>`}
        ${findings && e.raw ? `<details><summary class="muted">${tr('agentRaw')}</summary><pre class="raw">${esc(e.raw)}</pre></details>` : ''}
        ${e.applyRaw ? `<details><summary class="muted">${tr('prevApplyRaw')}</summary><pre class="raw">${esc(e.applyRaw)}</pre></details>` : ''}
      </div>
      <div class="dlg-foot">
        <button data-rerun>${runLabel}</button>
        ${e.sessionId ? `<button data-apply-comments>${tr('applyComments')}</button>` : ''}
        ${e.lastLog ? `<button data-log="${esc(key)}">${tr('log')}</button>` : ''}
        <span style="flex:1"></span>
        ${findings ? `<span class="muted">${tr('decided', { n: decided, total: findings.length })}</span>` : ''}
        <label><input type="checkbox" data-confirmed ${draft.confirmed ? 'checked' : ''} ${findings ? '' : 'disabled'}> ${tr('confirmed')}</label>

      </div>`;
  };

  dlg.onclick = async (ev) => {
    const t = ev.target;
    if (t.matches('[data-close]')) return dlg.close();
    if (t.matches('[data-log]')) return openLog(key);
    if (t.matches('[data-verdict]')) {
      const no = t.dataset.no;
      draft.decisions[no] = { ...draft.decisions[no], verdict: t.dataset.verdict };
      saveDraft(key, draft);
      return renderDlg();
    }
    if (t.matches('[data-confirmed]')) {
      draft.confirmed = t.checked;
      saveDraft(key, draft);
      return renderDlg();
    }
    if (t.matches('[data-apply-comments]')) {
      if (!confirmTwice(t, `apply-comments-btn:${key}`, tr('confirmRun'))) return;
      try {
        await applyComments(key);
        dlg.close();
        load();
      } catch (err) {
        toast(err.message);

    }
    if (t.matches('[data-submit]')) {
      if (!confirmTwice(t, `submit:${key}`, tr('confirmPush'))) return;
      try {

    if (!ev.target.matches('[data-reason]')) return;
    const no = ev.target.dataset.no;
    draft.decisions[no] = { ...draft.decisions[no], reason: ev.target.value };
    saveDraft(key, draft);
  };

  renderDlg();
  dlg.showModal();
}

// ---------- 指摘への事前判断 (AI 実行前) ----------

// AI の方針に引きずられないよう、AI を動かす前に人が各スレッドの妥当性を判断する。
// スレッドの番号は取得のたびに振り直されるので、判断は URL に結び付けて持つ
function openTriage(key, provider = board.config.provider || 'claude') {
  openKey = null; // idle のまま開くので、再描画で閉じないようにする
  const e = board.mine.find((p) => p.key === key);
  const threads = e.threads || [];
  const draft = { decisions: {}, ...loadDraft(`triage:${key}`) };
  const dlg = $('#review-dlg');
  const urlOf = (no) => threads.find((th) => String(th.no) === String(no))?.url;
  const toFinding = (th) => ({
    no: th.no,
    severity: th.kind === 'comment' ? tr('prComment') : '',
    url: th.url,
    path: th.path,
    line: th.line,
    title: th.author ? `@${th.author}` : '',
    body: [th.comment, th.latest && `── ${tr('latestComment')}${th.latest.author ? ` (@${th.latest.author})` : ''}\n${th.latest.body}`].filter(Boolean).join('\n\n'),
  });

  // 非同意は理由必須 (理由が無いと AI に判断材料を渡せない)。指摘ではないものは対象外にする
  const tally = () => {
    const ds = threads.map((th) => draft.decisions[th.url] || {});
    const decided = ds.filter((d) => d.verdict).length;
    const targets = ds.filter((d) => d.verdict && d.verdict !== 'skip').length;
    const ready = threads.length > 0 && decided === threads.length && !ds.some((d) => d.verdict === 'disagree' && !d.reason?.trim());
    // すべて対象外なら AI は動かさず、対象外として覚えるだけ
    return { ds, ready, label: tr(ready && targets === 0 ? 'triageSkipAll' : 'triageSubmit'), text: `${tr('decided', { n: decided, total: threads.length })} · ${tr('triageTargets', { n: targets })}` };
  };

  const renderDlg = () => {
    const { ds, ready, label, text } = tally();
    dlg.innerHTML = `
      <div class="dlg-head">
        <h3><a href="${esc(safeUrl(e.pr.url))}" target="docket-viewer">${esc(e.pr.repo.split('/')[1])} #${e.pr.number}</a> ${esc(e.pr.title)}</h3>
        <button data-close>${tr('close')}</button>
      </div>
      <div class="dlg-body">
        <p class="muted">${tr('desc.triage')} · ${providerLabel(provider)}</p>
        ${threads.length ? threads.map((th, i) => findingHtml(toFinding(th), ds[i], { agree: tr('ph.triage.agree'), disagree: tr('ph.triage.disagree') }, true)).join('') : `<p class="muted">${tr('noThreads')}</p>`}
      </div>
      <div class="dlg-foot">
        <span style="flex:1"></span>
        ${threads.length ? `<span class="muted">${text}</span>` : ''}
        <button class="primary" data-submit ${ready ? '' : 'disabled'}>${label}</button>
      </div>`;
  };

  dlg.onclick = async (ev) => {
    const t = ev.target;
    if (t.matches('[data-close]')) return dlg.close();
    if (t.matches('[data-verdict]')) {
      const url = urlOf(t.dataset.no);
      draft.decisions[url] = { ...draft.decisions[url], verdict: t.dataset.verdict };
      saveDraft(`triage:${key}`, draft);
      return renderDlg();
    }
    if (t.matches('[data-submit]')) {
      if (!confirmTwice(t, `triage:${key}`, tr('confirmRun'))) return;
      dlg.close();
      return runMine(key, 'fix', draft.decisions, provider);
    }
  };
  dlg.oninput = (ev) => {
    if (!ev.target.matches('[data-reason]')) return;
    const url = urlOf(ev.target.dataset.no);
    draft.decisions[url] = { ...draft.decisions[url], reason: ev.target.value };
    saveDraft(`triage:${key}`, draft);
    // 理由の有無で送信できるかが変わるが、入力中の textarea を作り直さないようボタンだけ切り替える
    const { ready, label } = tally();
    Object.assign(dlg.querySelector('[data-submit]'), { disabled: !ready, textContent: label });
  };

  renderDlg();
  dlg.showModal();
}

    if (t.dataset.cfg === 'logKeepDays') dlg.querySelector('[data-logs-clear="old"]').textContent = tr('logs.clearOld', { n: t.value });
    if (t.dataset.repo) {
      const mapping = cfg.repos[t.dataset.repo];
      const target = t.dataset.tool === 'codex' ? (mapping.codex ||= {}) : mapping;
      target[t.dataset.field] = t.value;
    }
    if (t.dataset.repo) for (const el of dlg.querySelectorAll('[data-preview]')) {
      const [r, field] = el.dataset.preview.split('|');
      if (r === t.dataset.repo && el.dataset.tool === t.dataset.tool) el.textContent = preview(r, field, t.dataset.tool);
    }
  };
  // 作業ディレクトリを変えたらスキル候補を取り直す
  dlg.onchange = async (ev) => {
    // 別の PC の設定を入力欄に読み込むだけで、反映は「保存」で行う (サーバー側でも sanitizeConfig で弾く)
    if (ev.target.matches('[data-import]')) {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        const kind = (v) => (Array.isArray(v) ? 'array' : v === null ? 'null' : typeof v);
        for (const [k, v] of Object.entries(data.config || {})) if (k in board.defaults && k !== 'consentVersion' && kind(v) === kind(board.defaults[k])) cfg[k] = v;
        if (data.terms && typeof data.terms === 'object') terms = data.terms;
        if (LANGS[data.uiLang]) uiLang = data.uiLang;
        skills = await fetchSkills();
      } catch {
        return toast(tr('cfg.badFile'));
      }
      renderDlg();
      return toast(tr('cfg.imported'));
    }
    if (ev.target.dataset.cfg !== 'workdir' && ev.target.dataset.field !== 'cwd') return;
    try {
      skills = await fetchSkills();
    } catch (e) {
      return toast(e.message);
    }
    renderDlg();
  };
  dlg.onclick = async (ev) => {
    const t = ev.target;
    // 再描画すると入力途中のテキストエリアが整形されるので、表示の切り替えだけにする
    if (t.dataset.pane) {
      pane = t.dataset.pane;
      for (const el of dlg.querySelectorAll('[data-pane], [data-pane-body]')) el.classList.toggle('on', (el.dataset.pane || el.dataset.paneBody) === pane);
      return;
    }
    // 「古いもの」は入力中 (未保存) の保存日数で消す
    const clear = t.dataset.logsClear;
    if (clear) {
      if (!confirmTwice(t, `logs-clear:${clear}`, tr('confirmDelete'))) return;
      try {
        const { removed, ...rest } = await api('/api/logs/clear', { method: 'POST', body: clear === 'all' ? { all: true } : { days: cfg.logKeepDays } });
        logs = rest;
        renderDlg(); // トーストは開いている dialog の中に出すので、描き直してから出す
        toast(tr('logs.cleared', { count: removed.count, size: fmtBytes(removed.bytes) }));
      } catch (err) {
        toast(err.message);
      }
      return;
    }
    // 保存するまでは反映しないので、確認なしで今のペインの入力を既定に戻す
    const reset = t.dataset.paneReset;
    if (reset) {
      if (reset === 'terms') terms = {};
      if (reset === 'lang') uiLang = browserLang();
      for (const k of PANE_KEYS[reset] || []) cfg[k] = structuredClone(board.defaults[k]);
      if (reset === 'agent-claude' || reset === 'agent-codex') {
        for (const [repo, mapping] of Object.entries(cfg.repos)) {
          const defaults = board.defaults.repos[repo] || {};
          if (reset === 'agent-codex') mapping.codex = structuredClone(defaults.codex || {});
          else for (const key of ['skill', 'args', 'selfSkill', 'selfArgs', 'fixSkill', 'fixArgs']) {
            if (key in defaults) mapping[key] = defaults[key];
            else delete mapping[key];
          }
        }
      }
      if (reset === 'agent' || reset === 'agent-targets') skills = await fetchSkills(); // 作業ディレクトリが変わるため
      renderDlg();
      return;
    }
    if (t.matches('[data-import-pick]')) return dlg.querySelector('[data-import]').click();
    if (t.matches('[data-export]')) {
      const { consentVersion, ...config } = cfg;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ config, terms, uiLang }, null, 2)], { type: 'application/json' }));
      a.download = 'docket-settings.json';
      a.click();
      URL.revokeObjectURL(a.href);
      return;
    }
    if (t.matches('[data-save]')) {
      // 失敗したらダイアログを閉じず、入力を残したまま知らせる
      try {
        await api('/api/config', { method: 'PUT', body: cfg });
      } catch (err) {
        return toast(err.message);
      }
      saveLaneNames(terms);
      if (uiLang !== lang) {
        try { localStorage.setItem('docket-lang', uiLang); } catch {}
        return location.reload();
      }
      await load();
      toast(tr('saved'));
    }
  };
  renderDlg();
}

// ---------- スプリント ----------

// 選んだプロジェクト・スプリントはブラウザごとに覚える (折りたたみはメモリのみ)
// people: 表示する担当者の login (null なら全員)。repos: 表示するリポジトリ (null なら全部)。statuses: 表示する Status 名 (null なら全部、'' は未設定)。rootOnly: 最上位 issue の担当者だけで絞る。openOnly: 進行中 (OPEN) の issue だけ出す
// periods: 期間別の区切り (設定で変わるので毎回取る)
const sp = { meta: {}, periods: {}, data: {}, error: null, loading: false, collapsed: new Set(), people: null, rootOnly: false, repos: null, statuses: null, openOnly: false };
const spGet = (k) => { try { return localStorage.getItem(`docket-sprint:${k}`); } catch { return null; } };
const spSet = (k, v) => { try { localStorage.setItem(`docket-sprint:${k}`, v); } catch {} };
const spProject = () => {
  const list = board.config.projects || [];
  return list.includes(spGet('project')) ? spGet('project') : list[0];
};
const spDay = (d, n = 0) => new Date(Date.parse(`${d}T00:00:00Z`) + n * 86400000).toISOString().slice(0, 10);
const spFmt = (d) => new Date(`${d}T00:00:00Z`).toLocaleDateString(lang, { month: 'numeric', day: 'numeric', timeZone: 'UTC' });
// 期間別の区切り名は長さ (7 / 14 日 / それ以外は月) から作る
const spTitle = (i) => {
  if (rmMode() !== 'period') return i.title;
  const days = (Date.parse(i.endDate) - Date.parse(i.startDate)) / 86400000 + 1;
  if (days === 7 || days === 14) return tr(days === 7 ? 'period.week' : 'period.2week', { date: spFmt(i.startDate) });
  return new Date(`${i.startDate}T00:00:00Z`).toLocaleDateString(lang, { year: 'numeric', month: 'long', timeZone: 'UTC' });
};
const spToday = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

// スプリントに出てくる担当者 (子孫も含む)。担当者がいない issue があれば login '' (未設定) を末尾に足す
function spPeople(roots) {
  const map = new Map();
  let unset = false;
  const walk = (n) => { n.assignees.forEach((a) => map.set(a.login, a)); unset ||= !n.assignees.length; n.children.forEach(walk); };
  roots.forEach(walk);
  const list = [...map.values()].sort((a, b) => a.login.localeCompare(b.login));
  return unset ? [...list, { login: '', avatarUrl: '' }] : list;
}

// スプリントに出てくるリポジトリ (子孫も含む)
function spRepos(roots) {
  const set = new Set();
  const walk = (n) => { set.add(n.repo); n.children.forEach(walk); };
  roots.forEach(walk);
  return set;
}

// スプリントに出てくる Status (子孫も含む)。プロジェクトの選択肢の順に並べ、Status が無い issue があれば '' (未設定) を末尾に足す
function spStatuses(roots) {
  const set = new Set();
  const walk = (n) => { set.add(n.status?.name || ''); n.children.forEach(walk); };
  roots.forEach(walk);
  const order = sp.meta[spProject()]?.statuses || [];
  return [...order.filter((s) => set.has(s)), ...[...set].filter((s) => s && !order.includes(s)), ...(set.has('') ? [''] : [])];
}

// 当たらない issue は外す (当たる子孫がいれば階層が分かるよう薄く残す)
const spPrune = (roots, hit) => {
  const prune = (n) => {
    const children = n.children.flatMap(prune);
    return hit(n) || children.length ? [{ ...n, children, dim: n.dim || !hit(n) }] : [];
  };
  return roots.flatMap(prune);
};

// 選んだリポジトリのどれか、かつ選んだ担当者のどれかに当たる issue だけ残す (それぞれ OR)
// 担当者は rootOnly なら最上位だけで判定して子孫はすべて出す
function spFilter(roots) {
  if (sp.repos) roots = spPrune(roots, (n) => sp.repos.has(n.repo));
  if (sp.statuses) roots = spPrune(roots, (n) => sp.statuses.has(n.status?.name || ''));
  if (sp.openOnly) roots = spPrune(roots, (n) => n.state === 'OPEN');
  if (!sp.people) return roots;
  const hit = (n) => (n.assignees.length ? n.assignees.some((a) => sp.people.has(a.login)) : sp.people.has(''));
  return sp.rootOnly ? roots.filter(hit) : spPrune(roots, hit);
}

// 表示方法ごとの左の一覧 (スプリント・期間)
const spItems = (url) => (rmMode() === 'period' ? sp.periods[url] : sp.meta[url]?.iterations);
const spSelKey = (url) => (rmMode() === 'sprint' ? `iteration:${url}` : `${rmMode()}:${url}`);
function spIteration(url) {
  const list = spItems(url);
  if (!list) return null;
  const saved = list.find((i) => i.id === spGet(spSelKey(url)));
  const today = spToday();
  return saved || list.find((i) => i.startDate <= today && today <= i.endDate) || list[0];
}
const spDataKey = (url, it) => `${rmMode()}|${url}|${it?.id}`;
const spData = () => sp.data[spDataKey(spProject(), spIteration(spProject()))];

async function loadSprint(refresh = false) {
  const url = spProject();
  // 前の取得が後から終わっても、今の選択のエラー・読み込み中表示を上書きしない
  const seq = (sp.seq = (sp.seq || 0) + 1);
  sp.error = null;
  if (!url) return renderSprint();
  sp.loading = true;
  renderSprint();
  const q = (extra) => `/api/sprint?${new URLSearchParams({ project: url, ...extra, ...(refresh && { refresh: '1' }) })}`;
  try {
    // タグにタイトルを出すため、未取得のプロジェクトのメタ情報も取る (今すぐ更新では選択中のプロジェクトだけ取り直す)
    await Promise.all((board.config.projects || []).filter((u) => u === url || (!refresh && !sp.meta[u])).map(async (u) => {
      sp.meta[u] = (await api(`/api/sprint?${new URLSearchParams({ project: u, ...(refresh && { refresh: '1' }) })}`)).meta;
    }));
    const mode = rmMode();
    if (mode === 'period') sp.periods[url] = (await api(q({ mode }))).periods;
    renderSprint();
    const it = spIteration(url);
    if (it) sp.data[spDataKey(url, it)] = await api(q(mode === 'sprint' ? { iteration: it.id } : { mode, id: it.id }));
  } catch (e) {
    if (seq === sp.seq) sp.error = e.message;
  }
  if (seq === sp.seq) sp.loading = false;
  renderSprint();
}

function renderSprint() {
  const el = $('#sprint');
  const projects = board.config.projects || [];
  if (!projects.length) {
    el.innerHTML = `<p class="muted">${tr('sp.noProjects')}</p>`;
    return;
  }
  const url = spProject();
  const meta = sp.meta[url];
  const mode = rmMode();
  const items = spItems(url);
  const it = spIteration(url);
  const data = it && sp.data[spDataKey(url, it)];
  const select = `<select data-sp-project title="${esc(url)}">${projects.map((u) => `<option value="${esc(u)}"${u === url ? ' selected' : ''}>${esc(sp.meta[u]?.title || u.replace(/^.*github\.com\//, ''))}</option>`).join('')}</select>`;
  // 閉じているときは選んだもののタイトルだけ出し、開いたら日付・件数も出す (spIterLabels)
  const itOpt = (i) => `<option value="${esc(i.id)}" data-short="${esc(spTitle(i))}" data-full="${esc(`${spTitle(i)} (${spFmt(i.startDate)} – ${spFmt(i.endDate)})${i.count === undefined ? '' : ` ${tr('sp.count', { n: i.count })}`}`)}"${i.id === it?.id ? ' selected' : ''}>${esc(spTitle(i))}</option>`;
  // サーバーが新しい順に絞って返すので、未来 / 現在 / 過去 に分けるだけ
  const today = spToday();
  const group = (label, list) => (list.length ? `<optgroup label="${label}">${list.map(itOpt).join('')}</optgroup>` : '');
  const itSelect = !items?.length ? '' : `<select data-sp-iteration>${
    group(tr('future'), items.filter((i) => i.startDate > today))
    + group(tr('current'), items.filter((i) => i.startDate <= today && today <= i.endDate))
    + group(tr('past'), items.filter((i) => i.endDate < today))}</select>`;
  const road = sp.error ? `<div class="banner" style="margin:12px">${esc(sp.error)}</div>`
    : mode === 'sprint' && meta && !meta.sprint ? `<p class="muted" style="padding:12px">${tr('sp.noIteration')}</p>`
    : mode === 'period' && meta && !meta.start && !meta.end ? `<p class="muted" style="padding:12px">${tr('err.noDateField')}</p>`
    : data ? roadmapHtml({ ...data, roots: spFilter(data.roots) }, mode === 'period' ? tr('sp.emptyPeriod') : tr('sp.emptySprint')) : `<p class="muted" style="padding:12px"><span class="spin"></span> ${tr('loading')}</p>`;
  // 再描画でロードマップのスクロール位置が戻らないようにする
  const scroll = el.querySelector('.sp-road');
  const pos = scroll && [scroll.scrollLeft, scroll.scrollTop];
    // 最上位 issue をまとめて畳む / 開く
  const allFolded = data?.roots.every((n) => !n.children.length || sp.collapsed.has(n.id));
  const foldAll = data?.roots.length ? `<button class="fold-all" data-sp-all="${allFolded ? 'open' : 'fold'}">${allFolded ? tr('sp.openAll') : tr('sp.foldAll')}</button>` : '';
  const right = `<span class="sp-right">${sp.loading ? '<span class="spin"></span>' : ''}${spRefetch(data)}${foldAll}</span>`;
  // スプリント・期間の選択もプロジェクトと一緒にフィルタの先頭に置く
  // 表示方法の切り替えはプロジェクトの右に区切り線付きで置く
  const modeSeg = `<span class="seg">${Object.entries(RM_MODES).map(([m, l]) => `<button data-rm-switch="${m}"${m === mode ? ' class="primary"' : ''}>${l}</button>`).join('')}</span>`;
  const peopleBar = spPeopleBar(data, right, `${field(tr('sp.project'), select)}<span class="sep"></span>${field(tr('sp.view'), modeSeg)}${itSelect && field(mode === 'period' ? tr('sp.period') : tr('sp.sprint'), itSelect)}`);
  el.innerHTML = `${peopleBar}
    <section class="sp-road">${road}</section>`;
  if (pos && data) [el.querySelector('.sp-road').scrollLeft, el.querySelector('.sp-road').scrollTop] = pos;
}

// 取得時刻を兼ねた手動更新ボタン (hover で ↻ を出す)
function spRefetch(data) {
  if (!data?.fetchedAt) return '';
  return `<button class="refetch" data-sp-refresh ${sp.loading ? 'disabled' : ''} title="${esc(new Date(data.fetchedAt).toLocaleString(lang))} — ${tr('sp.refetchTitle')}"><span class="hint">↻ </span>${tr('fetchedAgo', { ago: ago(data.fetchedAt) })}</button>`;
}

// lead: フィルタの先頭に区切り線付きで置く選択欄 (無ければ issue があるときだけ出す)
function spPeopleBar(data, foldAll, lead = '') {
  const people = data ? spPeople(data.roots) : [];
  // リポジトリは設定に登録したものを全部出し、issue が無いものは選べなくする
  const inData = data ? spRepos(data.roots) : new Set();
  const repos = [...new Set([...Object.keys(board.config.repos || {}), ...inData])];
  const shown = repos.filter((r) => inData.has(r) && (!sp.repos || sp.repos.has(r)));
  const repoSelect = inData.size && multiSelect('sp-repos', tr('repo'),
    `${!sp.repos ? tr('all') : shown.length ? esc(shown.map((r) => r.split('/')[1]).join(', ')) : tr('none')}`,
    repos.map((r) => ({ value: r, text: r.split('/')[1], disabled: !inData.has(r) })), (r) => !sp.repos || sp.repos.has(r));
  const on = people.filter((a) => !sp.people || sp.people.has(a.login));
  const summary = `${!sp.people ? tr('all') : on.length ? on.map((a) => (a.login ? `<img class="avatar" src="${esc(a.avatarUrl)}" alt="" title="${esc(a.login)}">` : tr('unset'))).join('') : tr('none')}`;
  const select = people.length && multiSelect('people', tr('sp.assignee'), summary, people.map((a) => ({ value: a.login, text: a.login || tr('unset'), img: a.avatarUrl })), (l) => !sp.people || sp.people.has(l),
    `<label class="ms-extra"><input type="checkbox" data-sp-root-only ${sp.rootOnly ? 'checked' : ''}>${tr('sp.rootOnly')}</label>`);
  const statuses = data ? spStatuses(data.roots) : [];
  const statusOn = statuses.filter((s) => !sp.statuses || sp.statuses.has(s));
  const statusSelect = statuses.length && multiSelect('sp-statuses', tr('sp.status'),
    `${!sp.statuses ? tr('all') : statusOn.length ? esc(statusOn.map((s) => s || tr('unset')).join(', ')) : tr('none')}`,
    statuses.map((s) => ({ value: s, text: s || tr('unset') })), (s) => !sp.statuses || sp.statuses.has(s));
  const openOnly = data?.roots.length && `<label><input type="checkbox" data-sp-open-only ${sp.openOnly ? 'checked' : ''}>${tr('sp.openOnly')}</label>`;
  const parts = [lead, repoSelect, select, statusSelect, openOnly].filter(Boolean);
  const active = sp.repos || sp.people || sp.statuses || sp.openOnly;
  return parts.length ? `<div class="sp-row"><div class="filter-wrap"><button class="filter-toggle${active ? ' primary' : ''}" title="${tr('filter')}"></button><div class="sp-people">${parts.join('<span class="sep"></span>')}</div></div><button data-sp-display>${tr('cardDisplay')}</button>${foldAll}</div>` : '';
}

const SP_DAY = 64;
const SP_MARGIN = 1;
const SP_INDENT = 14; // 親と同じ日に始まる子の棒を右にずらす幅 (階層ごと) // 複数スプリントにまたがる issue が続いていると分かるよう前後に余白を取る
// GitHub の Octicons (git-merge / git-pull-request / git-pull-request-draft)
const PR_ICON = {
  merged: 'M5.45 5.154A4.25 4.25 0 0 0 9.25 7.5h1.378a2.251 2.251 0 1 1 0 1.5H9.25A5.734 5.734 0 0 1 5 7.123v3.505a2.25 2.25 0 1 1-1.5 0V5.372a2.25 2.25 0 1 1 1.95-.218ZM4.25 13.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm8.5-4.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5ZM5 3.25a.75.75 0 1 0 0 .005V3.25Z',
  open: 'M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z',

};
const prKind = (pr) => (pr.state === 'MERGED' ? 'merged' : pr.isDraft ? 'draft' : 'open');
const prsHtml = (prs) => prs.map((pr) => `<a class="${prKind(pr)}" href="${esc(safeUrl(pr.url))}" target="docket-viewer" title="${esc(prKind(pr))}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="${PR_ICON[prKind(pr)]}"/></svg>#${pr.number}</a>`).join('');

function roadmapHtml({ sprint, roots }, empty) {
  if (!roots.length) return `<p class="muted" style="padding:12px">${empty}</p>`;
  const from = spDay(sprint.startDate, -SP_MARGIN);
  const days = Array.from({ length: (Date.parse(sprint.endDate) - Date.parse(from)) / 86400000 + 1 + SP_MARGIN }, (_, i) => spDay(from, i));
  const last = days.at(-1);
  const col = (d) => 1 + days.indexOf(d);
  const today = spToday();

  // 折りたたまれていない行を親 → 子 → 孫 の順に並べる
  // 開始日が親以前の子は、親の棒より少し右にずらして階層を見せる (開始日が親より後なら実際の日付どおり)
  // 開始日が設定されている issue は開始日の早い順、未設定は元の順のまま後ろへ
  const byStart = (list) => [...list].sort((a, b) => (a.rawStart ? 0 : 1) - (b.rawStart ? 0 : 1) || (a.rawStart || '').localeCompare(b.rawStart || ''));
  const groups = byStart(roots).map((root) => {
    const rows = [];
    const walk = (n, depth, parent) => {
      const shift = parent && n.start <= parent.n.start ? parent.shift + SP_INDENT : 0;
      const row = { n, depth, shift };
      rows.push(row);
      if (!sp.collapsed.has(n.id)) byStart(n.children).forEach((c) => walk(c, depth + 1, row));
    };
    walk(root, 0, null);
    return { rows };
  });
  const cells = [];
  days.forEach((d, i) => {
    const inSprint = d >= sprint.startDate && d <= sprint.endDate;
    const we = [0, 6].includes(new Date(`${d}T00:00:00Z`).getUTCDay());
    cells.push(`<div class="hd${we ? ' we' : ''}${d === today ? ' today' : ''}${inSprint ? ' in' : ''}" style="grid-row:1;grid-column:${1 + i}">${i === 0 || d.endsWith('-01') ? `${new Date(`${d}T00:00:00Z`).toLocaleDateString(lang, { month: 'short', timeZone: 'UTC' })}<br>` : '<br>'}${Number(d.slice(8))}</div>`);
    if (d === today) cells.push(`<div class="col today" style="grid-column:${1 + i}"></div>`);
  });
  let r = 2;
  const heights = [];
  for (const { rows } of groups) {
    rows.forEach(({ n, depth, shift }, i) => {
      const row = r + i;
      const sep = i === 0 ? ' sep' : '';
      const stCls = (n.state === 'OPEN' ? 's-open' : n.stateReason === 'NOT_PLANNED' ? 's-np' : 's-done') + (n.dim ? ' dim' : '');
      const toggle = n.children.length ? `<span class="tg" data-sp-toggle="${esc(n.id)}">${sp.collapsed.has(n.id) ? '▸' : '▾'}</span>` : '';
      if (sep) cells.push(`<div class="sep" style="grid-row:${row};grid-column:1 / -1"></div>`);
      // 実際の日付がスプリントからはみ出す部分は薄く伸ばす
      if (n.rawStart && n.rawStart < n.start) {
        cells.push(`<div class="bar ext ${stCls}" style="grid-row:${row};grid-column:${n.rawStart < from ? 1 : col(n.rawStart)} / ${col(n.start)}"></div>`);
      }
      if (n.rawEnd && n.rawEnd > n.end) {
        cells.push(`<div class="bar ext ${stCls}" style="grid-row:${row};grid-column:${col(n.end) + 1} / ${(n.rawEnd > last ? col(last) : col(n.rawEnd)) + 1}"></div>`);
      }
      const avatars = n.assignees.map((a) => `<img class="avatar" src="${esc(a.avatarUrl)}" alt="" title="${esc(a.login)}">`).join('');
      // サーバーのキャッシュが古いと prs が無い
      const hidden = cardHiddenOf('sprint');
      const prs = hidden.includes('prs') ? [] : n.prs || [];
      const spr = hidden.includes('sprint') ? null : n.sprintTitle;
      const st = hidden.includes('status') ? null : n.status;
      const sub = (n.inProject === false ? `<span class="np">${esc(tr('sp.noProject'))}</span>` : '') + (st ? `<span class="st st-${esc(String(st.color).toLowerCase())}">${esc(st.name)}</span>` : '') + (spr ? `<span class="spr">${esc(spr)}</span>` : '') + prsHtml(prs);
      heights.push(sub ? '48px' : '30px');
      const head = `${toggle}${avatars}<a class="t" href="${esc(safeUrl(n.url))}" target="docket-viewer">${esc(n.title)}</a><span class="muted">#${n.number}</span>`;
      const line = sub ? `<div class="ln">${head}</div><div class="ln prs">${sub}</div>` : head;
      cells.push(`<div class="bar ${stCls}${depth ? '' : ' d0'}${sub ? ' two' : ''}" style="grid-row:${row};grid-column:${col(n.start)} / ${col(n.end) + 1};margin-left:${Math.min(shift, (col(n.end) + 1 - col(n.start)) * SP_DAY - 24)}px" title="${esc(`${n.title}\n${n.start} – ${n.end}${n.rawStart || n.rawEnd ? `\n${tr('sp.barSet', { start: n.rawStart || tr('sp.unsetDate'), end: n.rawEnd || tr('sp.unsetDate') })}` : ` ${tr('sp.noDates')}`}`)}">${line}</div>`);
    });
    r += rows.length;
  }
  return `<div class="rm" style="grid-template-columns:repeat(${days.length}, ${SP_DAY}px);grid-template-rows:auto ${heights.join(' ')}">${cells.join('')}</div>`;
}

$('#sprint').addEventListener('click', (ev) => {
  const t = ev.target;
  if (t.closest('a[target]')) return;
  if (t.closest('[data-sp-refresh]')) return loadSprint(true);
  if (t.closest('[data-sp-display]')) return openCardDisplay();
  const rm = t.closest('[data-rm-switch]');
  if (rm) { location.hash = rm.dataset.rmSwitch; return; }
  const all = t.closest('[data-sp-all]');
  if (all) {
    const { roots = [] } = spData() || {};
    if (all.dataset.spAll === 'open') sp.collapsed.clear();
    else roots.forEach((n) => n.children.length && sp.collapsed.add(n.id));
    return renderSprint();
  }
  const people = t.closest('[data-ms="people"] [data-ms-bulk]');
  if (people) { sp.people = people.dataset.msBulk === 'all' ? null : new Set(); return renderSprint(); }
  const repos = t.closest('[data-ms="sp-repos"] [data-ms-bulk]');
  if (repos) { sp.repos = repos.dataset.msBulk === 'all' ? null : new Set(); return renderSprint(); }
  const statuses = t.closest('[data-ms="sp-statuses"] [data-ms-bulk]');
  if (statuses) { sp.statuses = statuses.dataset.msBulk === 'all' ? null : new Set(); return renderSprint(); }
  const toggle = t.closest('[data-sp-toggle]');
  if (toggle) {
    const id = toggle.dataset.spToggle;
    sp.collapsed.has(id) ? sp.collapsed.delete(id) : sp.collapsed.add(id);
    return renderSprint();
  }
});

$('#sprint').addEventListener('focusout', (ev) => ev.target.matches('[data-sp-iteration]') && spIterLabels(ev.target, false));

$('#sprint').addEventListener('change', (ev) => {
  if (ev.target.matches('[data-ms="people"] [data-ms-value]')) {
    const all = spPeople(spData()?.roots || []).map((a) => a.login);
    const set = sp.people || new Set(all);
    ev.target.checked ? set.add(ev.target.dataset.msValue) : set.delete(ev.target.dataset.msValue);
    sp.people = all.every((l) => set.has(l)) ? null : set; // 全員選んだら絞り込みなしに戻す
    return renderSprint();
  }
  if (ev.target.matches('[data-ms="sp-repos"] [data-ms-value]')) {
    const all = [...spRepos(spData()?.roots || [])];
    const set = sp.repos || new Set(all);
    ev.target.checked ? set.add(ev.target.dataset.msValue) : set.delete(ev.target.dataset.msValue);
    sp.repos = all.every((r) => set.has(r)) ? null : set; // 全部選んだら絞り込みなしに戻す
    return renderSprint();
  }
  if (ev.target.matches('[data-ms="sp-statuses"] [data-ms-value]')) {
    const all = spStatuses(spData()?.roots || []);
    const set = sp.statuses || new Set(all);
    ev.target.checked ? set.add(ev.target.dataset.msValue) : set.delete(ev.target.dataset.msValue);
    sp.statuses = all.every((s) => set.has(s)) ? null : set; // 全部選んだら絞り込みなしに戻す
    return renderSprint();
  }
  if (ev.target.matches('[data-sp-root-only]')) { sp.rootOnly = ev.target.checked; return renderSprint(); }
  if (ev.target.matches('[data-sp-open-only]')) { sp.openOnly = ev.target.checked; return renderSprint(); }
  if (ev.target.matches('[data-sp-iteration]')) { spSet(spSelKey(spProject()), ev.target.value); return loadSprint(); }
  if (ev.target.matches('[data-sp-project]')) { spSet('project', ev.target.value); return loadSprint(); }
});

// ---------- イベント ----------

// 自分の PR を レビュー待ち / マージ可能 / Done の間で移す (ドラッグと選択欄の共通処理)
function moveMine(key, lane) {
  if (lane === 'done') return api('/api/mine/done', { method: 'POST', body: { key, done: true } });
  return api('/api/mine/merge-ready', { method: 'POST', body: { key, ready: lane === 'mergeable' } });
}

async function applyComments(key) {
  await api('/api/mine/apply-comments', { method: 'POST', body: { key } });
  saveDraft(key, {});
}

async function runMine(key, mode, decisions, provider) {
  try {
    await api('/api/mine/run', { method: 'POST', body: { key, mode, decisions, provider } });
    saveDraft(key, {}); // 前回の判断が新しい結果の同じ番号に付かないようにする
  } catch (e) {
    toast(e.message);
  }
  load();
}

// 開いている間だけ取り直す。末尾を見ているときだけ自動で末尾へ追従する
async function openLog(key) {
  const dlg = $('#log-dlg');
  const pre = dlg.querySelector('pre');
  pre.textContent = tr('loading');
  dlg.showModal();
  const token = (openLog.token = {});
  while (dlg.open && openLog.token === token) {
    try {
      const { running, lines } = await api(`/api/log?key=${encodeURIComponent(key)}`);
      const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
      pre.textContent = lines.length ? lines.join('\n') : running ? tr('noOutputYet') : tr('runEnded');
      if (atBottom) pre.scrollTop = pre.scrollHeight;
      if (!running) return;
    } catch (e) {
      pre.textContent = e.message;
    }
    await new Promise((r) => setTimeout(r, 3000));
  }
}

async function review(key, provider) {
  try {
    await api('/api/review', { method: 'POST', body: { key, provider } });
    saveDraft(key, {}); // 前回の判断が新しい指摘の同じ番号に付かないようにする
  } catch (e) {
    toast(e.message);
  }
  load();
}

$('#board').addEventListener('click', async (ev) => {
  const t = ev.target;
  const jump = t.closest('[data-jump]');
  if (jump && $(`#board [data-pr="${CSS.escape(jump.dataset.jump)}"]`)) { ev.preventDefault(); return jumpTo(jump.dataset.jump); }
  if (t.closest('a[target]')) {
    viewing = jump?.dataset.jump ?? t.closest('[data-pr]')?.dataset.pr ?? viewing;
    // リンクの既定動作を妨げないよう、再描画せずクラスだけ付け替える
    document.querySelectorAll('#board .card.viewing').forEach((c) => c.classList.remove('viewing'));
    if (viewing) $(`#board [data-pr="${CSS.escape(viewing)}"]`)?.classList.add('viewing');
    return;
  }
  if (t.matches('[data-cancel]')) {
    if (!confirmTwice(t, `cancel:${t.dataset.cancel}`, tr('confirmCancel'))) return;
    try {
      await api('/api/cancel', { method: 'POST', body: { key: t.dataset.cancel } });
    } catch (e) {
      toast(e.message);
    }
    return load();
  }
  if (t.matches('[data-skip]')) {
    try {
      await api('/api/skip', { method: 'POST', body: { key: t.dataset.skip } });
    } catch (e) {
      toast(e.message);
    }
    return load();
  }
  if (t.matches('[data-dismiss]')) {
    try {
      await api('/api/dismiss', { method: 'POST', body: { key: t.dataset.dismiss } });
    } catch (e) {
      toast(e.message);
    }
    return load();
  }
  if (t.matches('[data-log]')) return openLog(t.dataset.log);
  if (t.matches('[data-mine-cancel]')) {
    if (!confirmTwice(t, `cancel:${t.dataset.mineCancel}`, tr('confirmCancel'))) return;
    try {
      await api('/api/mine/cancel', { method: 'POST', body: { key: t.dataset.mineCancel } });
    } catch (e) {
      toast(e.message);
    }
    return load();
  }
  const card = t.closest('[data-open]');
  if (card) return openReview(card.dataset.open);
  const mineCard = t.closest('[data-open-mine]');
  if (mineCard) openMine(mineCard.dataset.openMine);
});

let dragging = null;
const DROP_TO = { requested: ['reviewing', 'commented'], reviewing: ['requested'], reviewed: ['commented'], mine: ['mergeable', 'done'], planned: ['running'], mergeable: ['mine', 'done'], done: ['mine', 'mergeable'] };
const dropLane = (ev) => {
  const lane = ev.target.closest('[data-lane]');
  if (laneEdit) return laneDrag && lane?.dataset.lane !== laneDrag ? lane : null;
  return dragging && DROP_TO[dragging.from].includes(lane?.dataset.lane) ? lane : null;
};
$('#board').addEventListener('dragstart', (ev) => {
  if (laneEdit) {
    laneDrag = ev.target.closest('[data-lane]')?.dataset.lane;
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', laneDrag);
    return;
  }
  const card = ev.target.closest('[data-drag]');
  if (!card) return;
  dragging = { key: card.dataset.drag, from: card.dataset.from };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', dragging.key);
});
$('#board').addEventListener('dragover', (ev) => {
  const lane = dropLane(ev);
  if (!lane) return;
  ev.preventDefault();
  lane.classList.add('drop');
});
$('#board').addEventListener('dragleave', (ev) => {
  const lane = ev.target.closest('[data-lane]');
  if (lane && !lane.contains(ev.relatedTarget)) lane.classList.remove('drop');
});
$('#board').addEventListener('drop', async (ev) => {
  const lane = dropLane(ev);
  if (!lane) return;
  ev.preventDefault();
  if (laneEdit) {
    const from = laneEdit.indexOf(laneDrag);
    const to = laneEdit.indexOf(lane.dataset.lane);
    laneEdit.splice(to, 0, ...laneEdit.splice(from, 1));
    laneDrag = null;
    return render();
  }
  const { key, from } = dragging;
  dragging = null;
  if (lane.dataset.lane === 'reviewing') return review(key);
  try {
    if (lane.dataset.lane === 'commented') await api('/api/skip', { method: 'POST', body: { key } });
    else if (from === 'reviewing') await api('/api/cancel', { method: 'POST', body: { key } });
    else if (from === 'planned') {
      // confirm() は内蔵ブラウザで使えないので、ボタンの confirmTwice と同じく 2 回目のドラッグで実行する
      const id = `apply-comments:${key}`;
      if (armed?.id !== id || Date.now() >= armed.until) {
        armed = { id, until: Date.now() + CONFIRM_MS };
        return toast(tr('confirmApplyComments'));
      }
      armed = null;
      await applyComments(key);
    }
    else await moveMine(key, lane.dataset.lane);
  } catch (e) {
    toast(e.message);
  }
  load();
});
$('#board').addEventListener('dragend', () => {
  if (!dragging && !laneDrag) return;
  dragging = laneDrag = null;
  render();
});
$('#refresh').onclick = async () => {
  refreshing = true;
  render();
  await load(true);
  refreshing = false;
  render();
};
$('#stack-order').onclick = () => { stackOrder = !stackOrder; render(); };
$('#repo-filter').onclick = $('#repo-filter').onchange = (ev) => {
  const seg = ev.type === 'click' && ev.target.closest('[data-approved]');
  if (seg) {
    const next = { '': 'only', only: 'exclude', exclude: '' }[seg.dataset.approved];
    try { localStorage.setItem(`docket-approved:${view()}`, next); } catch {}
    return render();
  }
  const r = ev.type === 'change' && ev.target.dataset.msValue;
  const bulk = ev.type === 'click' && ev.target.closest('[data-ms-bulk]')?.dataset.msBulk;
  if (!r && !bulk) return;
  const kind = ev.target.closest('[data-ms]').dataset.ms;
  const hidden = hiddenOf(kind, view());
  const value = (p) => (kind === 'repos' ? p.pr.repo : p.pr.author?.login);
  const next = bulk === 'all' ? [] : bulk === 'none' ? [...new Set((view() === 'receive' ? board.mine : board.prs).map(value))]
    : ev.target.checked ? hidden.filter((x) => x !== r) : [...hidden, r];
  try { localStorage.setItem(hiddenKey(kind, view()), JSON.stringify(next)); } catch {}
  render();
};
window.addEventListener('hashchange', () => {
  laneEdit = null; // タブ切替で編集は破棄
  applyCardHidden();

  enterView();
});
// 画面に入ったときだけ描く (render のたびに描くと設定の入力中の値が消える)
function enterView() {
  if (view() === 'sprint') loadSprint();
  if (view() === 'settings') openSettings().catch((e) => toast(e.message));

}
$('#edit-lanes').onclick = () => {
  laneEdit = lanesFor(view()).map((l) => l.id);
  laneNameEdit = laneNames();
  render();
};
$('#board').addEventListener('input', (ev) => {
  const id = ev.target.dataset.laneName;
  if (id) laneNameEdit[`${view()}:${id}`] = ev.target.value;
});
$('#lane-save').onclick = () => {
  try { localStorage.setItem(laneOrderKey(view()), JSON.stringify(laneEdit)); } catch {}
  saveLaneNames(laneNameEdit);
  laneEdit = null;
  render();
};
$('#lane-cancel').onclick = () => {
  laneEdit = null;
  render();
};
// 「はじめる前に」。同意前は閉じられない (claude を起動する API もサーバー側で止めている)
function openConsent(required) {
  const dlg = $('#consent-dlg');
  dlg.querySelector('[data-close]').hidden = required;
  dlg.querySelector('[data-agree]').hidden = !required;
  dlg.oncancel = (ev) => required && ev.preventDefault(); // Esc で閉じさせない
  if (dlg.open) return; // 再読み込みのたびに呼ばれるので、開いている間はチェックを消さない
  dlg.querySelectorAll('.got input').forEach((cb) => (cb.checked = false));
  dlg.querySelector('[data-agree]').disabled = true;
  dlg.showModal();
}
// 全項目に「理解しました」を付けるまで同意ボタンを押せない
$('#consent-dlg').onchange = () => ($('#consent-dlg [data-agree]').disabled = [...$('#consent-dlg').querySelectorAll('.got input')].some((cb) => !cb.checked));
$('#consent-dlg').onclick = async (ev) => {
  if (ev.target.matches('[data-close]')) return $('#consent-dlg').close();
  if (!ev.target.matches('[data-agree]')) return;
  try {
    await api('/api/consent', { method: 'POST' });
    $('#consent-dlg').close();
    load();
  } catch (e) {
    toast(e.message);
  }
};
$('#tips').addEventListener('click', (ev) => ev.target.matches('[data-open-consent]') && openConsent(false));
// ---------- Tip の説明図 ----------
// 実際のカード・レーン・ロードマップの描画関数に架空のデータを渡して描く。名前や画像はすべて作りもの
const TIP_TEXT = {
  ja: { t: ['ログイン画面のエラー表示を改善', '注文一覧に CSV 出力を追加', '商品検索の並び替えを修正', '決済 API のタイムアウト設定', 'カートの数量変更を即時反映', 'お知らせ機能の下書き', 'README の手順を更新', '配送先住所の入力チェック', '会員ランク機能', 'ランク判定バッチ', 'ランク表示画面'],
    f: ['null のときに例外になります', 'items が空だと items[0] で TypeError になります。先に空配列をチェックしてください。', 'テストが足りません', '境界値 (0 件) のテストを追加してください。'], r: '別 PR で対応予定です',
    g: ['数量が 0 のときも考慮が必要では?', '関数名を calcTotal に変えませんか?', 'チームの規約で既存の名前に合わせています', 'Coverage: 82.4% (+0.3%)'] },
  ko: { t: ['로그인 화면의 오류 표시 개선', '주문 목록에 CSV 내보내기 추가', '상품 검색 정렬 수정', '결제 API 타임아웃 설정', '장바구니 수량 변경 즉시 반영', '공지 기능 초안', 'README 절차 갱신', '배송지 주소 입력 검사', '회원 등급 기능', '등급 판정 배치', '등급 표시 화면'],
    f: ['null일 때 예외가 납니다', 'items가 비어 있으면 items[0]에서 TypeError가 납니다. 먼저 빈 배열인지 확인하세요.', '테스트가 부족합니다', '경곗값(0건) 테스트를 추가하세요.'], r: '별도 PR에서 처리할 예정입니다',
    g: ['수량이 0일 때도 고려해야 하지 않을까요?', '함수 이름을 calcTotal로 바꾸면 어떨까요?', '팀 규칙상 기존 이름에 맞추고 있습니다', 'Coverage: 82.4% (+0.3%)'] },
  en: { t: ['Improve error messages on the login screen', 'Add CSV export to the order list', 'Fix sorting in product search', 'Set a timeout for the payment API', 'Apply cart quantity changes instantly', 'Draft of the notice feature', 'Update the steps in README', 'Validate the shipping address', 'Member rank feature', 'Rank calculation batch', 'Rank display screen'],
    f: ['Throws when the value is null', 'If items is empty, items[0] throws a TypeError. Check for an empty array first.', 'Tests are missing', 'Add a test for the boundary case (0 items).'], r: 'Will handle this in a separate PR',
    g: ["Shouldn't this also handle a quantity of 0?", 'How about renaming this to calcTotal?', 'Our team convention keeps the existing name', 'Coverage: 82.4% (+0.3%)'] },
};
const TIP_REPO = 'acme/shop-web';
const tipAvatar = (name, color) => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="${color}"/><text x="10" y="14" font-size="11" text-anchor="middle" fill="#fff" font-family="sans-serif">${name[0].toUpperCase()}</text></svg>`)}`;
const TIP_USERS = [['sakura', '#d1567a'], ['minho', '#2f81f7'], ['alex', '#1a7f37'], ['yuki', '#9a6700']].map(([login, c]) => ({ login, avatarUrl: tipAvatar(login, c) }));
const tipAgo = (min) => new Date(Date.now() - min * 60000).toISOString();
function tipPr(i, extra = {}) {
  const [me, a, b, c] = TIP_USERS;
  return {
    repo: TIP_REPO, number: 120 + i, url: '#', title: (TIP_TEXT[lang] || TIP_TEXT.ja).t[i], author: [a, b, c][i % 3], updatedAt: tipAgo(5 + i * 37),
    base: 'main', head: `feature/topic-${120 + i}`, labels: [], issues: [], state: 'OPEN', isDraft: false,
    reviews: i % 2 ? [{ ...me, state: 'APPROVED' }] : [], requested: [me, b], ...extra,
  };
}
const tipFindings = () => { const f = (TIP_TEXT[lang] || TIP_TEXT.ja).f; return [{ no: '1', severity: 'major', title: f[0], path: 'src/cart.js', line: 42, body: f[1] }, { no: '2', severity: 'minor', title: f[2], path: 'test/cart.test.js', body: f[3] }]; };
const tipUsage = { tokens: 184000, costUsd: 0.62 };
const TIP_ENTRIES = {
  review: () => [
    { status: 'requested', pr: tipPr(0) },
    { status: 'reviewing', startedAt: tipAgo(2), pr: tipPr(1) },
    { status: 'reviewed', findings: tipFindings(), usage: tipUsage, pr: tipPr(2) },
    { status: 'commented', postedUrl: '#', usage: tipUsage, pr: tipPr(3) },
  ],
  receive: () => [
    { status: 'idle', pr: tipPr(5, { isDraft: true }) },
    { status: 'idle', pr: tipPr(0) },
    { status: 'idle', pending: 2, pr: tipPr(1) },
    { status: 'running', mode: 'self', startedAt: tipAgo(3), pr: tipPr(2) },
    { status: 'planned', mode: 'self', findings: tipFindings(), pr: tipPr(3) },
    { status: 'idle', mergeReady: true, appliedAt: tipAgo(90), usage: tipUsage, pr: tipPr(4) },
    { status: 'idle', done: true, pr: tipPr(6) },
  ],
};
function tipLanes(v) {
  const entries = TIP_ENTRIES[v]().map((e, i) => ({ key: `tip:${i}`, ...e }));
  return `<div class="board">${lanesFor(v).map((lane) => {
    const cards = entries.filter(laneMatch(lane));
    return `<section class="lane"><h2><span class="dot" style="border-color:${lane.color}"></span>${esc(laneLabel(v, lane))}<span class="count">${cards.length}</span></h2>
      ${cards.map(v === 'receive' ? mineCardHtml : cardHtml).join('') || `<div class="muted" style="padding:4px">${tr('none')}</div>`}</section>`;
  }).join('')}</div>`;
}
function tipRoadmap() {
  const day = (n) => spDay(spToday(), n);
  const [me, a, b] = TIP_USERS;
  const t = (TIP_TEXT[lang] || TIP_TEXT.ja).t;
  const node = (i, start, end, extra = {}) => ({ id: `tip:${i}`, number: 300 + i, url: '#', title: t[i], start, end, state: 'OPEN', assignees: [], children: [], prs: [], ...extra });
  const root = node(8, day(-3), day(8), { assignees: [me], children: [
    node(9, day(-3), day(2), { assignees: [a], state: 'CLOSED', prs: [{ number: 131, url: '#', state: 'MERGED' }] }),
    node(10, day(1), day(8), { assignees: [b], prs: [{ number: 135, url: '#', state: 'OPEN', isDraft: true }] }),
  ] });
  return roadmapHtml({ sprint: { startDate: day(-4), endDate: day(9) }, roots: [root] }, '');
}
const TIP_SHOTS = {
  review: () => [tipLanes('review'), 0.6],
  receive: () => [tipLanes('receive'), 0.5],
  findings: () => {
    const fs = tipFindings();
    return [`<div class="dlg-body">${findingHtml(fs[0], { verdict: 'agree' })}${findingHtml(fs[1], { verdict: 'disagree', reason: (TIP_TEXT[lang] || TIP_TEXT.ja).r })}</div>
      <div class="dlg-foot"><span style="flex:1"></span><span class="muted">${tr('decided', { n: 2, total: 2 })}</span>
      <label><input type="checkbox" checked> ${tr('humanRead')}</label><label><input type="checkbox"> ${tr('approve')}</label><button class="primary">${tr('submit')}</button></div>`, 0.8];
  },
  // 指摘に対応を押したときの事前判断 (AI 実行前)
  triage: () => {
    const g = (TIP_TEXT[lang] || TIP_TEXT.ja).g;
    const items = [
      [{ no: 1, title: '@minho', path: 'src/cart.js', line: 42, body: g[0] }, { verdict: 'agree' }],
      [{ no: 2, title: '@alex', path: 'src/order.js', line: 8, body: g[1] }, { verdict: 'disagree', reason: g[2] }],
      [{ no: 3, severity: tr('prComment'), title: '@ci-bot', body: g[3] }, { verdict: 'skip' }],
    ];
    const ph = { agree: tr('ph.triage.agree'), disagree: tr('ph.triage.disagree') };
    return [`<div class="dlg-body">${items.map(([f, d]) => findingHtml(f, d, ph, true)).join('')}</div>
      <div class="dlg-foot"><span style="flex:1"></span><span class="muted">${tr('decided', { n: 3, total: 3 })} · ${tr('triageTargets', { n: 2 })}</span><button class="primary">${tr('triageSubmit')}</button></div>`, 0.65];
  },
  bar: () => {
    const bar = $('#board-bar').cloneNode(true);
    for (const el of [bar, ...bar.querySelectorAll('[id]')]) el.removeAttribute('id');
    return [bar.outerHTML, 0.9];
  },
  roadmap: () => [tipRoadmap(), 0.7],
  cost: () => {
    const [, , , running, , mergeable] = TIP_ENTRIES.receive();
    return [`<div class="cards">${[{ ...running, usage: tipUsage }, mergeable].map((e, i) => mineCardHtml({ key: `tip:c${i}`, ...e })).join('')}</div>`, 0.8];
  },
};
// 開くたびに描き直す (言語・設定・レーン名の変更を反映するため)。
// カードはリポジトリとスキルの対応を見てボタンを出すので、架空のリポジトリにも一時的にスキルを割り当てる
function withTipRepo(fn) {
  const repos = board.config.repos;
  board.config.repos = { ...repos, [TIP_REPO]: { skill: 'review', selfSkill: 'self-review', fixSkill: 'review-fix' } };
  try { return fn(); } finally { board.config.repos = repos; }
}
function tipShotEl(name) {
  const [html, zoom] = TIP_SHOTS[name]();
  const el = document.createElement('div');
  el.className = 'tip-shot';
  el.inert = true;
  el.innerHTML = `<div style="zoom:${zoom}">${html}</div>`;
  return el;
}
function renderTipShots() {
  withTipRepo(() => {
    for (const d of $('#tips').querySelectorAll('[data-shots]')) {
      d.querySelectorAll('.tip-shot').forEach((el) => el.remove());
      const lists = d.querySelectorAll(':scope > ul, :scope > ol');
      d.dataset.shots.split(',').forEach((name, i) => d.insertBefore(tipShotEl(name), lists[i] || null));
    }
  });
}
// About の本文は翻訳文に入れ、<div data-shot="..."> の位置に Tip と同じ説明図を描く
function renderAbout() {
  const el = $('#about');
  el.innerHTML = tr('about.html');
  withTipRepo(() => el.querySelectorAll('[data-shot]').forEach((d) => d.replaceWith(tipShotEl(d.dataset.shot))));
}
// モーダルの外側 (backdrop) を押したら、そのモーダルの閉じるボタンを押したのと同じにする
// 中で押し始めて外で離した (テキスト選択など) ときは閉じない。閉じるボタンが隠れている (同意前など) なら閉じない
const onBackdrop = (ev) => {
  if (ev.target.tagName !== 'DIALOG') return false;
  const r = ev.target.getBoundingClientRect();
  return ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom;
};
// ドロップダウンと同じく、ボタンで開閉し枠の外を押すと閉じる (中の操作で再描画されて押した要素が消えても閉じないよう composedPath で見る)
document.addEventListener('click', (ev) => {
  if (ev.target.closest('.filter-toggle')) return document.body.classList.toggle('filters-open');
  if (!ev.composedPath().some((el) => el.classList?.contains('filter-wrap'))) document.body.classList.remove('filters-open');
});
let downOnBackdrop = false;
document.addEventListener('mousedown', (ev) => (downOnBackdrop = onBackdrop(ev)));
document.addEventListener('click', (ev) => {
  if (downOnBackdrop && onBackdrop(ev)) ev.target.querySelector('.dlg-head [data-close]:not([hidden]), form.dlg-head button')?.click();
});
// カードに出す項目のうち隠すもの。タブごとにブラウザへ保存し、body のクラスで CSS から隠す
const CARD_PARTS = ['branch', 'issue', 'stack', 'updated', 'applied', 'usage', 'reviewers', 'author'];
// ロードマップは行の高さを JS で決めるので、クラスではなく描画時に読む
const ROADMAP_PARTS = ['status', 'sprint', 'prs'];
const partsOf = (v) => (v === 'sprint' ? ROADMAP_PARTS : CARD_PARTS);
const cardHiddenKey = (v) => `docket-card-hidden:${v}`;
const cardHiddenOf = (v) => { try { return JSON.parse(localStorage.getItem(cardHiddenKey(v))) || []; } catch { return []; } };
const saveCardHidden = (v, list) => { try { localStorage.setItem(cardHiddenKey(v), JSON.stringify(list)); } catch {} };
const applyCardHidden = () => { const h = cardHiddenOf(view()); CARD_PARTS.forEach((p) => document.body.classList.toggle(`hide-${p}`, h.includes(p))); };
applyCardHidden();
const otherBoard = () => (view() === 'review' ? 'receive' : 'review');
let cardDisplayChanged = false;
function openCardDisplay() {
  const h = cardHiddenOf(view());
  $('#display-dlg .dlg-body').innerHTML = partsOf(view()).map((p) => `<label><input type="checkbox" data-part="${p}"${h.includes(p) ? '' : ' checked'}> ${esc(tr(`cd.${p}`))}</label>`).join('');
  $('#display-dlg .dlg-foot').hidden = true;
  cardDisplayChanged = false;
  $('#display-dlg').showModal();
}
$('#card-display').onclick = openCardDisplay;
$('#display-dlg').onchange = (ev) => {
  const p = ev.target.dataset.part;
  const h = cardHiddenOf(view());
  saveCardHidden(view(), ev.target.checked ? h.filter((x) => x !== p) : [...h, p]);
  cardDisplayChanged = true;
  if (view() === 'sprint') return renderSprint();
  applyCardHidden();
};
// 閉じるとき、変更があってもう一方のボードと設定が違えば、同じ設定にするか聞く
function closeCardDisplay() {
  const dlg = $('#display-dlg');
  const same = (a, b) => [...a].sort().join() === [...b].sort().join();
  if (view() === 'sprint' || !cardDisplayChanged || !dlg.querySelector('.dlg-foot').hidden || same(cardHiddenOf(view()), cardHiddenOf(otherBoard()))) return dlg.close();
  dlg.querySelector('.dlg-body').innerHTML = `<p>${esc(tr('cd.copy', { view: tr(`tab.${otherBoard()}`) }))}</p>`;
  dlg.querySelector('.dlg-foot').hidden = false;
}
$('#display-dlg').oncancel = (ev) => { ev.preventDefault(); closeCardDisplay(); };
$('#display-dlg').onclick = (ev) => {
  if (ev.target.matches('[data-close]')) return closeCardDisplay();
  if (!ev.target.matches('[data-copy]')) return;
  if (ev.target.dataset.copy) saveCardHidden(otherBoard(), cardHiddenOf(view()));
  $('#display-dlg').close();
};

load().then(enterView);
// ローカル状態は設定した間隔で、GitHub はサーバー側の定期取得に任せる
// 設定変更を即反映するため毎回間隔を読み直す
(function poll() {
  // setTimeout は約 24.8 日を超えると 1 ms になるので 1 日で頭打ちにする
  setTimeout(() => load().finally(poll), Math.min(Math.max(1, Number(board.config.refreshSeconds) || 5), 86400) * 1000);
})();
</script>
